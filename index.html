<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="수습기자에서 사장까지, 내 언론사 창간까지. 한국 기자 커리어 시뮬레이션 웹게임 바이라인.">
<meta property="og:title" content="바이라인 — 기자 커리어 시뮬레이션">
<meta property="og:image" content="/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0e1220">
<title>바이라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 마스트헤드(이름·HUD) → 2D 장면 + 뉴스 티커 → 책상(할 일) | 수첩(탭) 2단, 폰에서는 1단 */
:root{
  --ink:#13151e; --panel:#1c1f2e; --panel2:#252a3d; --line:#373d58; --shadow:#07080c;
  --fg:#e9e5d8; --mute:#9c9fb3; --sodium:#f2a33a; --siren:#5b8ff0; --red:#e2574a; --good:#68c48d; --dev:#b07cf0;
  --paper:#ebe3cb; --paperInk:#211d17; --paperMute:#6d6557;
  --f-display:"Black Han Sans","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-pix:"DotGothic16","Gowun Dodum",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sodium);outline-offset:2px}
.num{font-family:var(--f-pix);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.brand{font-family:var(--f-display);font-size:34px;line-height:1;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:14px;height:14px;background:var(--sodium);box-shadow:4px 4px 0 var(--red)}
.brand small{font-family:var(--f-pix);font-size:12px;color:var(--mute);letter-spacing:.12em}
#hud{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{border:2px solid var(--line);background:var(--panel);padding:3px 9px;font-size:13px;white-space:nowrap}
.chip b{font-family:var(--f-pix);font-weight:400;color:var(--sodium)}
.chip.dv{border-color:var(--dev);color:var(--dev);cursor:pointer}

.stage{border:3px solid var(--line);background:#000;box-shadow:5px 5px 0 var(--shadow);position:relative}
#scene{display:block;width:100%;max-width:100%;aspect-ratio:256/96;image-rendering:pixelated;image-rendering:crisp-edges}
#cap{position:absolute;left:8px;top:8px;background:rgba(10,11,16,.82);border:2px solid var(--line);padding:2px 9px;font-family:var(--f-pix);font-size:12px;letter-spacing:.06em}
#tick{display:flex;gap:10px;align-items:center;background:#0b0c12;border-top:3px solid var(--line);padding:5px 10px;font-size:13px;overflow:hidden;white-space:nowrap}
#tick b{flex:none;background:var(--red);color:#fff;padding:0 7px;font-family:var(--f-pix);font-weight:400;font-size:12px}
#tick .tw{overflow:hidden;flex:1;min-width:0}
#tick .tr{display:inline-block;padding-left:100%;animation:tk 60s linear infinite}
#tick .tr span{margin-right:42px;color:var(--mute)}
#tick .tr span.me{color:var(--sodium)}
@keyframes tk{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){#tick .tr{animation:none;padding-left:0}}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width:840px){.grid{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 var(--shadow);min-width:0}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:3px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.bh h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.02em}
.bb{padding:12px}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips span{width:10px;height:10px;background:var(--line)}
.pips span.on{background:var(--sodium)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.act{text-align:left;background:var(--panel2);border:2px solid var(--line);padding:9px 10px;display:flex;flex-direction:column;gap:3px;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s}
.act:hover:not(:disabled){border-color:var(--sodium);transform:translate(-1px,-1px)}
.act:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.act:disabled{opacity:.42;cursor:not-allowed}
.act .an{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700}
.act .ad{font-size:12.5px;color:var(--mute);line-height:1.45}
.act .why{font-size:12px;color:var(--red)}
.act.free{border-style:dashed}
.next{margin-top:12px;width:100%;background:var(--sodium);color:#1a1206;border:3px solid #1a1206;padding:11px;font-family:var(--f-display);font-size:18px;box-shadow:4px 4px 0 var(--shadow)}
.next:hover{filter:brightness(1.08)}
.next:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--mute);margin:10px 0 0}

.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 8px 0;background:var(--panel2);border-bottom:3px solid var(--line)}
.tab{background:transparent;border:2px solid transparent;border-bottom:0;padding:5px 10px;font-size:13.5px;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--fg);margin-bottom:-3px;border-bottom:3px solid var(--panel)}
.tb{padding:12px;max-height:620px;overflow:auto}
.statrow{display:grid;grid-template-columns:72px minmax(0,1fr) 34px;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px}
.bar{height:10px;background:var(--ink);border:2px solid var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c,var(--sodium))}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--ink) 9px 10px)}
.sec{font-family:var(--f-pix);font-size:12px;letter-spacing:.14em;color:var(--mute);margin:14px 0 8px}
.sec:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.kv div{background:var(--panel2);border:2px solid var(--line);padding:7px 9px;min-width:0}
.kv span{display:block;font-size:12px;color:var(--mute)}
.kv b{font-family:var(--f-pix);font-weight:400;font-size:17px}
.card{background:var(--panel2);border:2px solid var(--line);padding:9px 10px;margin-bottom:8px}
.card .t{font-weight:700;line-height:1.4}
.meta{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;align-items:center}
.tag{display:inline-block;font-size:11.5px;padding:0 6px;border:2px solid currentColor;line-height:1.5;font-weight:700}
.tag.ex{color:var(--red)} .tag.ok{color:var(--good)} .tag.bl{color:var(--siren)} .tag.so{color:var(--sodium)} .tag.dv{color:var(--dev)}
.facts{list-style:none;margin:6px 0 0;padding:0;font-size:13px}
.facts li{display:flex;gap:7px;align-items:baseline;padding:1px 0}
.facts li::before{content:"";flex:none;width:8px;height:8px;background:var(--line);transform:translateY(1px)}
.facts li.h::before{background:var(--sodium)}
.facts li.v::before{background:var(--good)}
.facts li.v{color:var(--fg)} .facts li:not(.v){color:var(--mute)}
.facts small{color:var(--mute);font-size:11.5px}
.empty{color:var(--mute);font-size:13.5px;padding:8px 0}
.loglist{list-style:none;margin:0;padding:0;font-size:13.5px}
.loglist li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.loglist li span{font-family:var(--f-pix);color:var(--mute);font-size:12px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.achs div{border:2px dashed var(--line);padding:6px 8px;font-size:12.5px;color:var(--mute)}
.achs div.on{border-style:solid;border-color:var(--sodium);color:var(--fg)}
.achs small{display:block;font-size:11px;color:var(--mute)}

.clip{background:var(--paper);color:var(--paperInk);padding:12px 14px;border:2px solid #000;box-shadow:4px 4px 0 var(--shadow);margin-bottom:10px}
.clip .mh{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--paperMute);border-bottom:2px solid var(--paperInk);padding-bottom:4px;margin-bottom:7px;flex-wrap:wrap}
.clip .mh b{font-family:var(--f-display);font-weight:400;color:var(--paperInk);font-size:13px}
.clip h4{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.3;text-wrap:balance}
.clip p{margin:0;font-size:13px;line-height:1.6}
.clip .by{font-size:12px;color:var(--paperMute);margin-top:6px}
.clip.sm h4{font-size:15.5px}
.clip.sm p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmts{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.cmts li{padding:5px 8px;background:var(--panel2);border:2px solid var(--line);margin-bottom:4px}
.cmts li span{color:var(--mute);font-size:11.5px;margin-right:6px;font-family:var(--f-pix)}

.hero{display:grid;gap:14px;padding:4px 0}
.hero h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,8vw,72px);line-height:1.05;text-wrap:balance}
.hero p{margin:0;max-width:64ch;color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{background:var(--panel2);border:3px solid var(--line);padding:10px 16px;font-weight:700;box-shadow:4px 4px 0 var(--shadow)}
.btn.pri{background:var(--sodium);color:#1a1206;border-color:#1a1206}
.btn:hover{border-color:var(--sodium)}
.btn.sm{padding:5px 10px;font-size:13px;box-shadow:2px 2px 0 var(--shadow)}
.how{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.how div{background:var(--panel);border:2px solid var(--line);padding:10px 12px;font-size:13.5px}
.how b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;margin-bottom:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{text-align:left;background:var(--panel2);border:2px solid var(--line);padding:9px 11px;box-shadow:3px 3px 0 var(--shadow)}
.opt[aria-pressed="true"]{border-color:var(--sodium);background:#33291b}
.opt b{display:block}
.opt span{font-size:12.5px;color:var(--mute)}
.field{display:flex;flex-direction:column;gap:6px;max-width:340px}
.field input{background:var(--ink);border:3px solid var(--line);padding:9px 11px;color:var(--fg);font:inherit}
.group{margin-bottom:16px}
.group h4{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.group h4 small{font-family:var(--f-body);font-size:12.5px;color:var(--mute)}
.oc{text-align:left;background:var(--panel2);border:2px solid var(--line);padding:10px 11px;display:flex;flex-direction:column;gap:5px;box-shadow:3px 3px 0 var(--shadow)}
.oc[aria-pressed="true"]{border-color:var(--sodium);background:#33291b}
.oc .on{font-weight:700;font-size:15.5px}
.oc .od{font-size:12.5px;color:var(--mute);line-height:1.45}
.stars{color:var(--sodium);font-family:var(--f-pix);letter-spacing:1px}
.spark{width:100%;height:70px;display:block}

#modal{position:fixed;inset:0;background:rgba(5,6,10,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
#modal .mbx{background:var(--panel);border:3px solid var(--sodium);box-shadow:8px 8px 0 var(--shadow);width:min(660px,100%);max-height:100%;overflow:auto}
#modal .mt{background:var(--sodium);color:#1a1206;padding:7px 12px;font-family:var(--f-display);font-size:19px;position:sticky;top:0;z-index:1}
#mb{padding:12px 14px 4px;font-size:14.5px}
#mb p{margin:0 0 9px}
.lede{font-size:15.5px}
.feed{list-style:none;padding:0;margin:0 0 8px;font-size:13.5px}
.feed li{padding:5px 8px;border-left:4px solid var(--line);background:var(--panel2);margin-bottom:5px}
.feed li.g{border-color:var(--good)} .feed li.r{border-color:var(--red)} .feed li.s{border-color:var(--sodium)} .feed li.q{border-color:var(--siren);font-style:normal}
.fx{font-size:13px;color:var(--sodium)}
.warn{font-size:13px;color:var(--red)}
.choices{display:flex;flex-direction:column;gap:7px;padding:8px 14px 14px}
.ch{text-align:left;background:var(--panel2);border:2px solid var(--line);padding:9px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:3px 3px 0 var(--shadow)}
.ch:hover:not(:disabled){border-color:var(--sodium)}
.ch:disabled{opacity:.42;cursor:not-allowed}
.ch .cl{font-weight:700}
.ch .cs{font-size:12.5px;color:var(--mute)}
.ch.ghost{background:transparent;box-shadow:none}
.ch.dv{border-color:var(--dev)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;background:var(--panel2);border:2px solid var(--line);margin-bottom:6px;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--sodium)}
.chk small{display:block;color:var(--mute);font-size:12px}
.sent{display:block;width:100%;text-align:left;background:var(--paper);color:var(--paperInk);border:2px solid #000;padding:7px 10px;margin-bottom:6px;font-size:14px}
.sent[aria-pressed="true"]{background:#f3c7a8;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.meter{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;margin:4px 0 8px}
.timer{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:8px;flex-wrap:wrap}
.timer i{width:14px;height:14px;background:var(--sodium);display:inline-block}
.timer i.off{background:var(--line)}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:3px solid var(--sodium);padding:8px 14px;box-shadow:5px 5px 0 var(--shadow);font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.devp{border-color:var(--dev)}
.devp .bh{background:#2b2240}
.devg{display:flex;flex-wrap:wrap;gap:6px}
.devg button{background:var(--panel2);border:2px solid var(--dev);padding:5px 9px;font-size:13px}
.devg select{background:var(--ink);color:var(--fg);border:2px solid var(--dev);padding:4px;font:inherit;font-size:13px}
@media (prefers-reduced-motion:reduce){.act{transition:none}}
/* ===== v4 부드러운 테마 (위 규칙을 덮어쓴다) ===== */
:root{
  --ink:#0e1220; --panel:#161b2b; --panel2:#1e2538; --panel3:#262e45; --line:#2e3752; --line2:#3a4566; --shadow:rgba(0,0,0,.38);
  --fg:#eeeae2; --mute:#9aa2bb; --sodium:#ffb84d; --sodium2:#ff9a3d; --siren:#77a6ff; --red:#ff6f61; --good:#5ad49b; --dev:#b98cff; --pink:#ff8fb1;
  --paper:#f3ecdb; --paperInk:#231f19; --paperMute:#71695b;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-pix:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:16px; --r2:12px; --r3:9px;
}
html,body{background:var(--ink)}
body{background:radial-gradient(1200px 600px at 10% -10%,rgba(119,166,255,.10),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(255,184,77,.08),transparent 60%),var(--ink);background-attachment:fixed;letter-spacing:-.005em}
.num{font-family:var(--f-pix);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sodium);outline-offset:2px;border-radius:10px}
.brand{font-size:30px;font-weight:400}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--sodium),var(--sodium2));box-shadow:0 6px 18px rgba(255,154,61,.35);position:relative}
.brand i::after{content:"";position:absolute;left:8px;top:7px;width:14px;height:16px;border-radius:2px 2px 6px 2px;background:#fff8ec;transform:rotate(-8deg)}
.brand small{font-family:var(--f-body);font-size:12.5px;letter-spacing:.02em}
.chip{border:1px solid var(--line);background:rgba(30,37,56,.75);backdrop-filter:blur(6px);border-radius:999px;padding:4px 11px}
.chip b{font-family:var(--f-pix);font-weight:600}
.stage{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 14px 40px var(--shadow);background:#0a0d18}
#scene{image-rendering:auto;aspect-ratio:256/96}
#cap{border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(10,12,22,.6);backdrop-filter:blur(6px);font-family:var(--f-body);font-size:12.5px;padding:3px 12px;left:12px;top:12px}
#tick{border-top:1px solid var(--line);background:rgba(8,10,18,.92);padding:7px 12px}
#tick b{border-radius:6px;font-family:var(--f-display);font-size:12.5px;padding:1px 8px}
.box{border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 34px var(--shadow);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 120px),var(--panel);overflow:hidden}
.bh{border-bottom:1px solid var(--line);background:transparent;padding:12px 16px}
.bh h3{font-size:19px}
.bb{padding:14px 16px}
.pips{gap:4px}.pips span{width:11px;height:11px;border-radius:50%;background:var(--line2)}
.pips span.on{background:var(--sodium);box-shadow:0 0 8px rgba(255,184,77,.6)}
.acts{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:9px}
.act{border:1px solid var(--line);border-radius:var(--r2);box-shadow:none;background:var(--panel2);padding:11px 12px;transition:transform .12s,border-color .12s,background .12s}
.act:hover:not(:disabled){transform:translateY(-2px);border-color:var(--sodium);background:var(--panel3)}
.act:active:not(:disabled){transform:translateY(0);box-shadow:none}
.act.free{border-style:dashed}
.act.rec{border-color:rgba(255,184,77,.7);background:linear-gradient(180deg,rgba(255,184,77,.12),rgba(255,184,77,.03)),var(--panel2)}
.act.rec .an::before{content:"추천";font-size:10.5px;font-family:var(--f-display);background:var(--sodium);color:#2a1a05;border-radius:999px;padding:0 7px;margin-right:4px;order:-1}
.act .an{font-family:var(--f-display);font-weight:400;font-size:15.5px;justify-content:flex-start}
.act .an .pips{margin-left:auto}
.act .ad{font-size:12.5px}
.agrp{margin:2px 0 12px}
.agrp>h5{margin:0 0 7px;font-family:var(--f-display);font-weight:400;font-size:13.5px;color:var(--mute);display:flex;align-items:center;gap:7px}
.agrp>h5 i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--sodium))}
.next{border:0;border-radius:14px;box-shadow:0 10px 26px rgba(255,154,61,.28);background:linear-gradient(135deg,var(--sodium),var(--sodium2));color:#2a1705;font-size:18px;padding:13px}
.hint{font-size:12.8px}
.tabs{gap:6px;padding:10px 12px;background:transparent;border-bottom:1px solid var(--line)}
.tab{border:1px solid transparent;border-radius:999px;padding:5px 12px;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--panel3);border-color:var(--line2);color:var(--fg);margin-bottom:0;border-bottom:1px solid var(--line2)}
.tb{padding:14px 16px;max-height:680px}
.statrow{grid-template-columns:76px minmax(0,1fr) 36px}

.kv div{border:1px solid var(--line);border-radius:var(--r3);background:var(--panel2)}
.kv b{font-family:var(--f-pix);font-weight:700;font-size:17px}
.card{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2);padding:11px 12px}
.tag{border:1px solid currentColor;border-radius:999px;padding:0 8px;font-weight:600;font-family:var(--f-body)}

.opt,.oc{border:1px solid var(--line);border-radius:var(--r2);box-shadow:none;background:var(--panel2)}
.opt[aria-pressed="true"],.oc[aria-pressed="true"]{border-color:var(--sodium);background:linear-gradient(180deg,rgba(255,184,77,.13),rgba(255,184,77,.04)),var(--panel2);box-shadow:0 0 0 1px var(--sodium) inset}
.opt b{font-family:var(--f-display);font-weight:400;font-size:15.5px}
.field input{border:1px solid var(--line2);border-radius:12px;background:var(--panel2)}
.group h4{font-size:18px}
.stars{font-family:var(--f-body)}
#modal{background:rgba(5,7,14,.62);backdrop-filter:blur(5px)}
#modal .mbx{border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.55);background:var(--panel)}
#modal .mt{background:linear-gradient(180deg,var(--panel3),var(--panel));color:var(--fg);border-bottom:1px solid var(--line);padding:14px 18px;font-size:19px}
#modal .mt::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sodium);margin-right:9px;vertical-align:2px;box-shadow:0 0 10px var(--sodium)}
#mb{padding:14px 18px 4px}
.feed li{border-left:3px solid var(--line2);border-radius:0 10px 10px 0}
.choices{gap:8px;padding:10px 18px 18px}
.ch{border:1px solid var(--line);border-radius:var(--r2);box-shadow:none;background:var(--panel2);padding:11px 14px;transition:border-color .12s,background .12s,transform .12s}
.ch:hover:not(:disabled){border-color:var(--sodium);background:var(--panel3);transform:translateX(2px)}
.ch .cl{font-weight:700}
.ch.ghost{border-color:transparent}
.chk{border:1px solid var(--line);border-radius:10px}
.sent{border:1px solid rgba(0,0,0,.25);border-radius:10px}
.timer i{border-radius:4px}
#toast{border:1px solid var(--sodium);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.45);background:var(--panel3)}

.brand{white-space:nowrap}
@media (max-width:560px){.brand small{display:none}.brand{font-size:26px}}
details.more{margin-top:8px}details.more>summary{cursor:pointer;font-size:12.5px;color:var(--mute);list-style:none;padding:4px 0}details.more>summary::before{content:'＋ ';color:var(--sodium)}details.more[open]>summary::before{content:'－ '}
/* 화면 크기 대응: 폰에선 창이 꽉 차고, 탭은 옆으로 밀고, 버튼은 손가락 크기 */
button,.chk,.ch,.act,.opt,.tab{min-height:44px}
.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tab{flex:none;white-space:nowrap}
details.more>summary{cursor:pointer;color:var(--mute);font-size:13px;padding:8px 2px;list-style:none}
details.more>summary::before{content:"＋ ";color:var(--sodium)}details.more[open]>summary::before{content:"－ "}
@media (max-width:840px){.tb{max-height:none}#scene{aspect-ratio:256/80}}
@media (max-width:600px){
 body{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));font-size:15px}
 #modal{padding:0;align-items:flex-end}
 #modal .mbx{width:100%;max-height:94dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
 #hud .chip{display:none}#hud .chip:first-child,#hud button.chip{display:inline-flex}
 #mb{flex:1 1 auto;overflow:auto}
 #modal .choices{flex:none;max-height:46dvh;overflow:auto;border-top:1px solid var(--line);background:var(--panel);padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
 .acts{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}
 .act{padding:9px 10px}.act .ad{display:none}
 .dash{gap:8px}.dcard{padding:12px}
 .rings{gap:2px}.ring b{font-size:14px}
 .mini b{font-size:14px}
 .next{position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:5}
 #hud{justify-content:flex-start}.chip{font-size:12px}
 .hero2{gap:10px}.stats4 b{font-size:24px}
 .statrow{grid-template-columns:64px minmax(0,1fr) 30px}
}
@media (max-width:380px){.acts{grid-template-columns:minmax(0,1fr)}}
/* 한눈에 보는 상황판 */
.dash{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.9fr);gap:12px}
@media (max-width:900px){.dash{grid-template-columns:minmax(0,1fr)}}
.dcard{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(160deg,rgba(255,255,255,.035),transparent 60%),var(--panel);padding:14px 16px;box-shadow:0 10px 28px var(--shadow);min-width:0}
.who{display:flex;gap:13px;align-items:center}
.ava{flex:none;width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--c1,#5b7cff),var(--c2,#9a6bff));display:grid;place-items:center;font-family:var(--f-display);font-size:26px;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.who h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.15}
.who p{margin:2px 0 0;color:var(--mute);font-size:13px}
.prog{margin-top:12px}
.prog .pl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin-bottom:5px;gap:8px}
.prog .pl b{color:var(--fg);font-family:var(--f-display);font-weight:400}
.reqs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.reqs span{font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line2);color:var(--mute)}
.reqs span.ok{border-color:rgba(90,212,155,.6);color:var(--good)}
.rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.ring{--v:50;--c:var(--sodium);width:100%;max-width:74px;aspect-ratio:1;margin:0 auto;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),rgba(255,255,255,.07) 0);display:grid;place-items:center;position:relative}

.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.mini span{display:block;font-size:11.5px;color:var(--mute)}
.mini b{font-family:var(--f-pix);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nudge{margin-top:10px;font-size:13px;background:rgba(255,184,77,.08);border:1px solid rgba(255,184,77,.25);border-radius:12px;padding:8px 11px;color:#ffd9a0}

/* 타이틀 */
.hero2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:860px){.hero2{grid-template-columns:minmax(0,1fr)}}
.hcopy{padding:8px 4px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--sodium);background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.3);border-radius:999px;padding:3px 12px}
.hcopy h1{margin:14px 0 10px;font-family:var(--f-display);font-weight:400;font-size:clamp(38px,6.4vw,64px);line-height:1.08;letter-spacing:-.01em;text-wrap:balance}

.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-top:12px}

@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(90,212,155,0)}100%{box-shadow:0 0 0 0 rgba(90,212,155,0)}}

.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mode{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--mc) 16%,transparent),transparent 70%),var(--panel);text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--mc)}
.mode .mi{width:38px;height:38px;border-radius:12px;background:var(--mc);display:grid;place-items:center;color:#14131a;font-family:var(--f-display);font-size:18px}
.mode b{font-family:var(--f-display);font-weight:400;font-size:19px}
.mode span{font-size:13px;color:var(--mute);line-height:1.5}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.feat div{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);padding:12px 14px;font-size:13.5px;color:var(--mute)}
.feat b{display:block;color:var(--fg);font-family:var(--f-display);font-weight:400;font-size:16px;margin-bottom:3px}
.sech{font-family:var(--f-display);font-weight:400;font-size:21px;margin:8px 0 10px}

/* 도움말 */
.help-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.help-nav button{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:4px 12px;font-size:13px}
.help-nav button[aria-pressed="true"]{border-color:var(--sodium);color:var(--sodium)}
.gloss{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.gloss dt{font-family:var(--f-display);color:var(--sodium)}
.gloss dd{margin:0;color:var(--fg)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}

/* 로딩 화면 */
#loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(800px 500px at 50% 30%,rgba(255,184,77,.14),transparent 60%),var(--ink);transition:opacity .55s ease,visibility .55s;padding:16px}
#loader.done{opacity:0;visibility:hidden;pointer-events:none}
#loader .ld{width:min(420px,100%);text-align:center}
#loader .ldlogo{font-family:var(--f-display);font-size:44px;color:var(--fg);display:flex;align-items:center;justify-content:center;gap:12px}
#loader .ldlogo i{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--sodium),var(--sodium2));box-shadow:0 8px 26px rgba(255,154,61,.45);position:relative;animation:ldbob 1.6s ease-in-out infinite}
#loader .ldlogo i::after{content:"";position:absolute;left:12px;top:10px;width:20px;height:24px;border-radius:3px 3px 9px 3px;background:#fff8ec;transform:rotate(-8deg)}
#loader .ldlogo small{display:block;font-family:var(--f-pix);font-size:12px;letter-spacing:.32em;color:var(--mute)}
#loader .ldpaper{margin:22px auto 18px;width:200px;height:118px;background:var(--paper);border-radius:6px;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-2deg);text-align:left;overflow:hidden}
#loader .ldpaper b{display:block;height:12px;border-radius:2px;background:var(--paperInk);width:70%;margin-bottom:9px}
#loader .ldpaper span{display:block;height:5px;border-radius:2px;background:#cfc5ae;margin:6px 0;transform-origin:left;animation:ldline 1.4s ease-in-out infinite}
#loader .ldpaper span:nth-child(3){width:86%;animation-delay:.15s}#loader .ldpaper span:nth-child(4){width:92%;animation-delay:.3s}#loader .ldpaper span:nth-child(5){width:64%;animation-delay:.45s}#loader .ldpaper span:nth-child(6){width:80%;animation-delay:.6s}#loader .ldpaper span:nth-child(7){width:50%;animation-delay:.75s}
#loader .ldbar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
#loader .ldbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sodium),#ff7d6b);border-radius:99px;transition:width .35s ease}
#loader #ldt{margin:12px 0 4px;color:var(--fg);font-size:14.5px;min-height:1.4em}
#loader .ldtip{color:var(--mute);font-size:13px;min-height:2.8em;margin:0}
@keyframes ldbob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-6deg)}}
@keyframes ldline{0%{transform:scaleX(.15);opacity:.4}50%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:.85}}
@media (prefers-reduced-motion:reduce){#loader .ldlogo i,#loader .ldpaper span{animation:none}}

const QB=QB_RAW.split('\n').map(l=>l.split('|'));
const QCATS=[...new Set(QB.map(r=>r[0]))];
function drawQuiz(n){const by={};QB.forEach(r=>(by[r[0]]=by[r[0]]||[]).push(r));const out=shuffle(by['언론']).slice(0,2);const cats=shuffle(QCATS.filter(c=>c!=='언론'));let i=0;while(out.length<n){const c=cats[i%cats.length];const cand=shuffle(by[c]).find(r=>!out.includes(r));if(cand)out.push(cand);i++;if(i>200)break;}return shuffle(out).map(r=>({c:r[0],q:r[1],a:r[2],o:shuffle(r.slice(2))}));}

  if(!isRegD(d)){// 일반 부서: 차장 위 직급(부장·부국장·국장)은 딱 한 명, 반드시 있어야 한다. 차장은 0~1명.
    // 원칙: 부서장(차장 위 직급)은 한 명. 다만 작은 부서는 차장이 '부장 직무대리'로 이끌 수 있고, 큰 부서는 차장이 둘 이상일 수 있다
    list.forEach(m=>{if(m.r>=2)m.acting=0;});
    const heads=list.filter(m=>(m.r||0)>=2).sort((a,b)=>(b.r-a.r)||(myrs(b)-myrs(a)));heads.slice(1).forEach(m=>m.r=1);
    let mids=list.filter(m=>m.r===1).sort((a,b)=>myrs(b)-myrs(a));
    if(!heads.length&&list.length>=2){const h=mids[0]||list.slice().sort((a,b)=>myrs(b)-myrs(a))[0];
      if(list.length<=7&&(mids.length||chance(.5))){h.r=1;h.acting=1;}else{h.r=2;h.acting=0;}mids=mids.filter(m=>m!==h);}
    const head=list.find(m=>m.r>=2)||list.find(m=>m.acting);const maxMid=list.length<=3?0:1+Math.floor(list.length/12);
    mids.filter(m=>m!==head).slice(maxMid).forEach(m=>m.r=0);
    list.forEach(m=>{if(m!==head)m.acting=0;});
    const top=list.find(m=>m.r>=2)||list.find(m=>m.acting),mid=list.find(m=>m.r===1&&!m.acting);
    if(top){const need=top.r>=3?19:top.acting?12:15;if(myrs(top)<need)top.yrs+=need-myrs(top);}
    if(mid){const cap=top?myrs(top)-2:22;if(myrs(mid)>cap)mid.yrs-=myrs(mid)-cap;if(myrs(mid)<10)mid.yrs+=10-myrs(mid);}
    const cap0=mid?myrs(mid)-1:top?myrs(top)-3:12;list.filter(m=>!m.r).forEach(m=>{if(myrs(m)>cap0)m.yrs-=myrs(m)-cap0;if(m.yrs<1)m.yrs=1;});
    if(top){const mx=Math.max(0,...list.filter(m=>m!==top).map(myrs));if(myrs(top)<=mx)top.yrs+=mx-myrs(top)+1;}return list;}
  // 지역 부서(전국부·주재): 지역마다 차장 이상이 여럿일 수 있다. 다만 연차는 직급을 따른다
  const regs={};list.forEach(m=>(regs[m.reg||'본사']=regs[m.reg||'본사']||[]).push(m));
  Object.values(regs).forEach(L=>{L.forEach(m=>{const lo=[1,10,15,19][Math.min(3,m.r||0)];if(myrs(m)<lo)m.yrs+=lo-myrs(m);});const minLead=Math.min(...L.filter(m=>m.r).map(myrs).concat([99]));L.filter(m=>!m.r).forEach(m=>{if(myrs(m)>=minLead)m.yrs-=myrs(m)-minLead+1;if(m.yrs<1)m.yrs=1;});});
  return list;}

RUN.newdept=function(){const o=OUT();const cand=Object.keys(DEPTS).filter(d=>!o.depts.includes(d)&&d!=='loc').slice(0,12);const setup=+(.02+.015*o.p).toFixed(2);

function target(it,m){const un=it.facts.filter(f=>!fOK(f));if(!un.length)return null;const M=METH[m];const mt=un.filter(f=>M.k.includes(f.k));const pool=mt.length?mt:un;return pool.find(f=>f.key)||pool[0];}
function mChance(it,m,f){
  const M=METH[m];const src=bestSrc(it.d);let p=.32+M.st()/200+src/300+clamp((50-it.imp)/250,-.1,.12);
  if(!M.k.includes(f.k))p*=.35;
  if(it.alert>=60&&['docs','ask','call'].includes(m))p*=.65;
  const er=netRel(it.ent);if(['call','docs','ask'].includes(m))p+=clamp(er,-40,60)/320;if(m==='docs'&&S.net&&S.net[it.ent]&&S.net[it.ent].block)p*=.35;if(m==='data'&&hasF('data'))p+=.08;if(m==='scene'&&S.gear&&S.gear.camera)p+=.1;if(['call','ask'].includes(m)&&S.gear&&S.gear.rec)p+=.04;if(m==='data'&&S.gear&&S.gear.tablet)p+=.05;

RUN.meeting=function(){
  const heads=S.team.length?S.team:[genMember(S.dept)];const area=S.area;const tv=isTV();
  const pool=OUT().depts.filter(d=>S.rank>=6||!area||AREAS[cat1(d)]===area);
  const N=S.rank>=5||S.founder?6:5;
  const P=Array.from({length:N},()=>{const m=pick(heads);const d=pick(pool.length?pool:OUT().depts);const it=makeItem(d,{excl:chance(.4)});return{m,d,it,vr:R(30,100)/100,choice:null};});
  const OPT=[['front',tv?'첫 꼭지':'1면 톱','크게 터지거나 크게 다친다 · 1건만'],['sub',tv?'메인뉴스':'1면 하단','눈에 띄되 위험은 절반 · 2건까지'],['in','안쪽 면','무난하다'],['more','보강 지시','더 단단해져 돌아온다 · 단독은 뺏길 수도'],['kill','킬','기사를 접는다']];
  const LIM={front:1,sub:2};const vw=v=>v>=.8?'탄탄':v>=.6?'대체로 확인':v>=.45?'절반쯤':'아직 약함';
  const board=()=>{const cnt=k=>P.filter(p=>p.choice===k).length;
    openModal(`${tv?'보도국':'편집'} 회의 주재 · 발제 ${N}건`,`<p>데스크들이 오늘 ${tv?'뉴스':'지면'}에 올릴 기사 ${N}건을 가져왔다. 먼저 전부 훑어보고, 기사마다 어떻게 할지 정한 뒤 회의를 마친다.</p>
     <p class="hint">${OPT.map(o=>`<b>${o[1]}</b> ${o[2]}`).join(' · ')}</p>
     ${P.map((p,i)=>`<div class="card mtc${p.choice?' done':''}"><div class="t">${i+1}. 「${esc(p.it.title)}」 ${p.it.excl?'<span class="tg h">단독</span>':''}${p.it.adv?'<span class="tg">광고주 관련</span>':''}${p.it.ideo?'<span class="tg">논조 갈림</span>':''}</div>
       <div class="meta"><span>${esc(p.m.name)} · ${DEPTS[p.d].n} 데스크</span><span>확인 ${pct(p.vr)} (${vw(p.vr)})</span><span>파급력 ${p.it.imp}</span></div>
       <div class="mopt">${OPT.map(([k,n])=>{const full=LIM[k]&&cnt(k)>=LIM[k]&&p.choice!==k;return `<button type="button" class="mob${p.choice===k?' on':''}" data-mi="${i}" data-mk="${k}" ${full?'disabled':''}>${n}</button>`;}).join('')}</div></div>`).join('')}
     <p class="hint" id="mleft">${P.filter(p=>!p.choice).length?`아직 정하지 않은 기사 ${P.filter(p=>!p.choice).length}건 — 회의를 마치면 안쪽 면으로 간다.`:'모두 정했다.'}</p>`,
     [{label:'이대로 회의를 마친다',sub:'행동력을 쓴다',fn:()=>{P.forEach(p=>{if(!p.choice)p.choice='in';});resolve();return false;}},
      {label:'추천대로 정리',sub:'확인·파급력 기준으로 자동 배정 (바꿀 수 있다)',fn:()=>{const o=P.slice().sort((a,b)=>b.it.imp*b.vr-a.it.imp*a.vr);P.forEach(p=>p.choice=null);o.forEach((p,i)=>{p.choice=p.vr<.45?(p.it.imp>=50?'more':'kill'):i===0&&p.vr>=.7?'front':i<=2&&p.vr>=.6?'sub':'in';});board();return false;}},
      {label:'회의를 미룬다',sub:'행동력은 쓰지 않는다',cls:'ghost'}]);
    document.querySelectorAll('#mb [data-mi]').forEach(b=>b.onclick=()=>{const p=P[+b.dataset.mi];p.choice=p.choice===b.dataset.mk?null:b.dataset.mk;const st=$('#modal .mbx').scrollTop;board();$('#modal .mbx').scrollTop=st;});};
  const resolve=()=>{
    spend(1,4);setCd('meeting');const lines=[];const fx={eval:0,fame:0,trust:0};
    P.forEach(p=>{const val=p.it.imp*p.vr*(p.it.excl?1.3:1);
      if(p.choice==='front'||p.choice==='sub'){const h=p.choice==='front'?1:.5;fx.fame+=val/90*h;fx.eval+=(p.vr>=.7?.8:-.8)*h;S.co.q+=p.vr*1.5*h;
        if(p.vr<.6&&chance((1-p.vr)*.32*DF().risk*h)){S.pending.push({type:'err',title:p.it.title,due:S.turn+R(1,3),desk:1});lines.push({c:'r',t:`${p.choice==='front'?(tv?'첫 꼭지':'1면 톱'):(tv?'메인뉴스':'1면 하단')} 「${p.it.title}」 — 확인이 덜 됐다. 찜찜하다.`});}
        else lines.push({c:'g',t:`${p.choice==='front'?(tv?'첫 꼭지':'1면 톱'):(tv?'메인뉴스':'1면 하단')} 「${p.it.title}」 — ${p.vr>=.7?'탄탄하다. 타사들이 받아썼다.':'반응은 있었다.'}`});if(p.choice==='front')tick(`[${OUT().n}] ${p.it.excl?'[단독] ':''}${p.it.title}`,1);}
      else if(p.choice==='in'){fx.eval+=.2;S.co.q+=p.vr*.5;lines.push({c:'',t:`안쪽 면 「${p.it.title}」`});}
      else if(p.choice==='more'){(S.reinforce=S.reinforce||[]).push({title:p.it.title,imp:p.it.imp,excl:p.it.excl,vr:Math.min(1,p.vr+.3),m:p.m.name,due:S.turn+1});p.m.skill=clamp(p.m.skill+.5,0,95);lines.push({c:'s',t:`「${p.it.title}」 보강 지시. ${p.m.name} 팀이 한 달 더 판다.`});}
      else{if(val>=40){fx.eval-=.6;p.m.skill=clamp(p.m.skill-.5,0,95);lines.push({c:'r',t:`「${p.it.title}」 킬. ${p.m.name}의 표정이 굳었다.`});if(p.it.excl&&chance(.4))tick(`[${pick(OUTLETS.filter(o=>o.id!==S.outlet)).n}] [단독] ${p.it.title}`);}else{fx.trust+=.3;lines.push({c:'',t:`「${p.it.title}」 킬. 깔끔한 판단이었다.`});}}
    });
    openModal('회의 결과',`<ul class="feed">${lines.map(l=>`<li class="${l.c}">${esc(l.t)}</li>`).join('')}</ul>${fxLine(apply(fx))}`);
  };
  board();
};

function buildEnts(o){
  const cats=new Set(['pol']);o.depts.forEach(d=>catOf(d).forEach(c=>cats.add(c)));
  const out=[];const seen=new Set();const add=(e,c)=>{if(seen.has(e[0]))return;seen.add(e[0]);out.push([e[0],e[1],e[2],c,e[3]]);};
  cats.forEach(c=>{if(c==='loc'&&REGIONS[o.id]){const g=REGIONS[o.id];[['city',`${g[1]}청`,'gov',.08],['lcouncil',`${g[1]}의회`,'gov',.01],['ledu',`${g[1]}교육청`,'gov',.02],['lcon',g[2],'corp',.1],['lbank',g[3],'corp',.07],['luniv',`${g[0]}대학교`,'corp',.03],['lchamber',`${g[0]} 상공회의소`,'corp',.03],['pr_mayor',`${g[1]} 단체장`,'person',0],['pr_mp',`${g[0]} 지역구 의원`,'person',0],['pr_boss',`${g[0]} 상공회의소 회장`,'person',0]].forEach(e=>add(e,'loc'));}
    else (ENT_BASE[c]||[]).forEach(e=>add(e,c));});
  if(!cats.has('eco'))ENT_BASE.eco.filter(e=>e[2]==='corp').slice(0,6).forEach(e=>add(e,'eco'));
  try{deptEntsFor(o).forEach(e=>{if(!seen.has(e[0])){seen.add(e[0]);out.push(e);}});}catch(x){}
  (TYPE_ENT[o.type]||[]).forEach(e=>add(e,o.type==='econ'?'eco':o.type==='sports'?'spo':'pol'));
  (ID_ENT[o.id]||[]).forEach(e=>add(e,catOf(o.depts[0])[0]));
  if(REGIONS[o.id])out.forEach(e=>{if(e[2]==='corp'&&e[3]!=='loc')e[4]=+(e[4]*.4).toFixed(3);});
  return normEnts(out,o);
}
// 이름 있는 기관·광고주를 다 합쳐도 광고 매출의 35% 정도 (나머지는 중소 광고주·지역 상인·온라인 광고망)
function normEnts(L,o){const t=L.reduce((a,e)=>a+(e[4]||0),0);if(t>.35){const k=.35/t;L.forEach(e=>{if(e[4])e[4]=Math.max(.001,+(e[4]*k).toFixed(4));});}
  // 광고는 한 곳당 최소 월 50만 원
  const ad=(o&&o.ad)||(S&&S.outlet&&OUT()?OUT().ad:1);const mw=.005/Math.max(.05,ad);L.forEach(e=>{if(e[4]&&e[4]<mw)e[4]=+mw.toFixed(4);});return L;}

function lifeMonth(lines){
  if(S.savings){S.savings+=Math.round(S.savings*.003);}
  if(S.fixed&&S.fixed.until<=S.turn){const g=Math.round(S.fixed.amt*1.04);S.money+=g;lines.push({c:'g',t:`정기예금 만기 · ${g.toLocaleString('ko-KR')}만 원 입금 (이자 ${g-S.fixed.amt}만)`});S.fixed=null;}
  if(S.cheongOn){if(S.money>=20){S.money-=20;S.cheong=(S.cheong||0)+20;S.cheongM=(S.cheongM||0)+1;if(S.cheongM===24)lines.push({c:'g',t:'주택청약 24개월 — 이제 집을 살 때 8% 싸게 살 수 있다'});}}
  let inv=0;if(S.etf){const d=Math.round(S.etf*R(-4,5)/100);S.etf=Math.max(0,S.etf+d);inv+=d;}if(S.stock){const d=Math.round(S.stock*R(-12,14)/100);S.stock=Math.max(0,S.stock+d);inv+=d;}
  if(inv)lines.push({c:inv>0?'g':'r',t:`투자 평가 ${inv>0?'+':''}${inv.toLocaleString('ko-KR')}만 원 (ETF ${(S.etf||0).toLocaleString('ko-KR')}만 · 주식 ${(S.stock||0).toLocaleString('ko-KR')}만)`});
  if(S.penY&&S.turn%YW>=YW-4){const r=Math.round(S.penY*.132);S.money+=r;lines.push({c:'g',t:`연말정산 · 연금저축 세액공제 ${r}만 원 환급`});S.penY=0;}
  const L=living(),buf=S.money+(S.savings||0);if(buf>=L*6){gain('men',.4);S.hp=clamp(S.hp+3,0,100);}else if(buf<L*2){gain('men',-.5);lines.push({c:'r',t:'통장이 바닥이다. 돈 걱정에 잠이 안 온다 (멘탈↓)'});}
  if(S.loan>0){const pay=Math.round(S.loan*.006);S.money-=pay;S.loan=Math.max(0,S.loan-Math.round(pay*.45));}
  if(S.leaseLoan>0){S.money-=Math.round(S.leaseLoan*.0025);}
  if(S.gear&&S.gear.car)S.money-=30;
}

RUN.personnel=function(){

   ${pool.map((m,i)=>`<label class="chk" data-prow="${m.d}"><input type="checkbox" data-pi="${i}"><span>${esc(m.name)} ${MR[Math.min(3,m.r||0)]} · ${myrs(m)}년 차 · ${npcAge(m)}세 · ${DEPTS[m.d]?DEPTS[m.d].n:''}<small>종합 실력 ${Math.round(m.skill)}${(m.r||0)>=1?' · 간부':''}${(m.r||0)<2&&myrs(m)>=[10,15][m.r||0]?' · 승진 연차':''}</small></span></label>`).join('')}`,

function personSel(){return [...document.querySelectorAll('#mb input[data-pi]:checked')].map(x=>S._pp[+x.dataset.pi]).filter(Boolean);}
function personBatch(kind){const sel=personSel();if(!sel.length){toast('먼저 기자를 골라 주세요');return false;}

  if(kind==='move'){openModal('부서 이동',`<p>${sel.length}명을 어디로 보낼까?</p>`,OUT().depts.slice(0,14).map(d=>({label:DEPTS[d].n,fn:()=>{done();sel.forEach(m=>{if(m.d!==d){m.d=d;m.skill=clamp(m.skill+(chance(.5)?2:-2),0,95);if(isRegD(d)&&S.corr){m.reg=pick(corrPlan(OUT()).regs);m.role='주재기자';if(m.r>=2)m.r=1;S.corr.push(m);}else if(m.reg){m.reg=null;if(S.corr)S.corr=S.corr.filter(x=>x!==m);}}});S.ros=null;log(`인사: ${sel.length}명 ${DEPTS[d].n} 발령`);toast(`${sel.length}명 ${DEPTS[d].n} 발령`);}})).concat([{label:'뒤로',cls:'ghost',fn:()=>{RUN.personnel();return false;}}]));return false;}
  done();let ok=0,bad=0;
  let full=0;const pool=S._pp||[];
  sel.forEach(m=>{if(kind==='up'&&(m.r||0)<2){const tr=(m.r||0)+1;if(!isRegD(m.d)&&pool.some(x=>x!==m&&x.d===m.d&&(x.r||0)===tr&&!sel.includes(x))){full++;return;}m.r=tr;const minY=[0,10,15][tr];if(m.skill>=55&&myrs(m)>=minY-2){ok++;m.skill+=1;}else bad++;if(myrs(m)<minY)m.yrs+=Math.ceil((minY-myrs(m))/3);}
    if(kind==='down'&&(m.r||0)>0){m.r--;if(m.skill<50)ok++;else bad++;}

    if(k==='abuse')v+=(c.pen>=3?-3:0)+(c.share<ctx.avg?1:0);

 ['기사 · 속보 · 단독 · 특종',`<div class="tfig">${scoopBanner('특종')}${clipHTML({o:'대한일보',d:'soc',date:'3월',place:'1면 톱',h:'[단독] 시 산하기관, 채용 직전 자격 요건 바꿨다',lead:'시 산하기관이 신입 채용 공고 사흘 전 자격 요건을 바꾼 사실이 확인됐다.',by:S&&S.name?S.name:'한서진',excl:true},true)}</div>`,
  ['야마 → 리드 → 팩트 → 제목 순서로 쓴다. 단계마다 되돌릴 수 있다.','먼저 쓰면 <b>단독</b>, 파급력과 완성도가 높으면 <b>특종</b>, 확인까지 탄탄하면 <b>대특종</b>. 사건이 터지면 <b>속보</b> 경쟁이 붙는다.','미확인 사실·반론 누락·낚시 제목은 오보와 <b>언론중재위원회</b>로 돌아온다. 들키면 <b>정정·반론보도</b>로 바로잡을지, 버틸지 고른다.','제보가 가끔 허위이거나, 파 보니 알맹이가 없을 때도 있다.']],
 ['평가 · 평판 · 신뢰 · 능력치',`<div class="tfig"><div class="trings">${tRing(58,'var(--siren)','사내 평가')}${tRing(24,'var(--sodium)','업계 평판')}${tRing(61,'var(--good)','신뢰도')}${tRing(80,'var(--pink)','컨디션')}</div></div>`,
  ['셋 다 쉽게 오르지 않는다. 평가는 높을수록 더 오르기 어렵고, 가만두면 내려간다.','능력치는 높을수록 천천히 큰다. 능력치를 누르면 역할과 효과가 나온다.','부서마다 <b>잘 크는 능력치</b>와 특수 효과가 다르다.']],
 ['같은 부서 사람들',`<div class="tfig"><div class="card" style="border-color:rgba(119,166,255,.35)"><div class="t">사건팀 현황</div><div class="meta"><span>인원 8명</span><span>평균 7년 차</span><span>분위기 가까움</span></div><ul class="pnl"><li><span class="tg pc">부서 특성</span>단독이 자주 터지고 몸이 고되다</li></ul></div><div class="acts">${tAct('부서 사람들과','밥·노하우·같이 취재·원고 검토',1,1)}</div></div>`,
  ['"부서 사람들과"에서 동료와 밥을 먹고, 선배에게 배우고, 같이 취재한다.','부서 인원·분위기·회사 규모에 따라 행동력·아이템·컨디션 효과가 붙는다.','동료가 아이템을 넘겨주기도 하고, 내가 넘길 수도 있다.']],
 ['직급마다 다른 일',`<div class="tfig"><div class="tladder">${['수습','기자','차장','부장','부국장','국장','편집국장','사장'].map((r,i)=>`<span class="${i<2?'done':i===2?'cur':''}">${r}</span>`).join('')}</div><div class="card rkc" style="margin-top:8px"><div class="t">출입처 장악도 · 출입처 터줏대감</div>${bar(58,'var(--good)')}</div></div>`,
  ['기자·차장은 <b>출입처 장악도</b>를 쌓고, 차장·부장은 <b>제자</b>를 키우고, 부장은 <b>부서 성적표</b>로 겨룬다.','부국장~편집국장은 경쟁사와 <b>1면 대결</b>, 편집국장은 1년짜리 <b>어젠다 캠페인</b>, 사장은 <b>이사회 KPI</b>.','편집국장부터는 현장 대신 지휘와 경영을 한다.']],
 ['승진 · 이직 · 정년',`<div class="tfig"><div class="tsteps"><span class="on">작은 회사: 빨리</span><span class="cur">큰 회사: 동기 경쟁</span><span>이직: 직급 재조정</span></div></div>`,
  ['승진은 1월·7월 정기 인사. 작은 회사일수록 빨리, 큰 매체는 조건을 채워도 밀릴 수 있다.','이직하면 회사 규모에 따라 직급이 오르거나 내려간다.','회사가 어렵거나 오래 승진이 멈추면 드물게 <b>희망퇴직·권고사직</b> 제안이 온다.','기자 <b>정년은 60세</b>(임원 65세). 선임기자로 남거나 퇴직금으로 창간할 수 있고, 창간 대표는 70세가 넘어서도 뛸 수 있다.']],
 ['관계망 · 경쟁사 · 시장',`<div class="tfig"><div class="trel"><p><span>시청</span>${bar(64,'var(--good)')}<b class="num">+64</b></p><p><span>태산건설</span>${bar(12,'var(--red)')}<b class="num">−38</b></p></div><div class="tshare" style="margin-top:8px"><i style="width:34%;background:var(--sodium)">우리 34%</i><i style="width:41%;background:var(--siren)">경쟁사</i><i style="width:25%;background:var(--line2)">기타</i></div></div>`,
  ['기관·광고주와의 관계가 광고·자료·소송을 좌우한다.','경쟁사는 전략을 갖고 움직이고, 내가 커지면 견제한다. 어려움일수록 영리하다.','해마다 새 매체가 생기고, 돈이 바닥난 매체는 폐간된다.']],
 ['돈 · 회사 경영',`<div class="tfig"><div class="tshare" style="height:24px"><i style="width:28%;background:var(--siren)">광고</i><i style="width:40%;background:var(--good)">구독</i><i style="width:18%;background:var(--sodium)">포털</i><i style="width:14%;background:var(--dev)">사업</i></div><div class="acts" style="margin-top:8px">${tAct('행사 사업 유치','마라톤·탁구대회·축제',1)}${tAct('수익 다변화','뉴스레터·영상·멤버십',1)}</div></div>`,
  ['월급과 생활비가 매달 정산된다. "월급 쓰기 → 내 돈으로"에서 사비 출장·책 출간·부업도 할 수 있다.','간부·사장은 포털 제휴·구독·수익 사업·지자체 행사로 돈줄을 넓힌다.','광고에만 기대면 관계망이 흔들릴 때 돈줄도 흔들린다.']],
 ['창간 모드',`<div class="tfig"><div class="tgrid2"><div class="card"><div class="t">발행인 업무</div><div class="meta"><span>영업 · 채용 · 투자 · 포털 · 사업</span></div></div><div class="card"><div class="t">기자 업무</div><div class="meta"><span>발굴 · 취재 · 기사</span></div></div></div></div>`,
  ['내 회사의 <b>대표이자 1호 기자</b>. 작은 회사일 땐 한 달에 취재와 경영을 둘 다 해야 보너스.','창업 초기엔 취재·영업·채용부터, 제휴·투자·사업·행사는 회사가 자리 잡으면 열린다.','창간부터 10주년까지 이어지는 이야기가 있다. 자금이 바닥 아래로 떨어지면 파산. 첫 2년은 창업 지원금과 박봉으로 숨통이 트인다.','창간 대표는 35세 이상에서 시작하고, 정년 없이 70세 무렵부터 은퇴를 고민한다.']]
];
function tutorial(i=0){const TUT=TUTF();const n=TUT.length;const [t,fig,pts]=TUT[i];
  openModal(`튜토리얼 ${i+1}/${n} · ${t}`,`<div class="tdots">${TUT.map((_,k)=>`<i class="${k===i?'on':k<i?'done':''}"></i>`).join('')}</div>${fig}<ul class="tpts">${pts.map(p=>`<li>${p}</li>`).join('')}</ul>`,[...(i<n-1?[{label:'다음',fn:()=>{tutorial(i+1);return false;}}]:[{label:'시작하자'}]),...(i>0?[{label:'이전',cls:'ghost',fn:()=>{tutorial(i-1);return false;}}]:[]),{label:'닫기',cls:'ghost'}]);}
const PATCH=[ // 업데이트 내역: ['버전','제목',['대규모|… / 주요|… / 수정|…'],'날짜',['한눈에 보기']] — 주요 사항만 짧게, 새 버전은 맨 위
 ['5.1','수습기자 · 광고 주기 · 보기 쉬운 화면',[
  '대규모|수습기자: 사회부 계열 부서에는 1월·7월 공채 시즌에 수습이 배치될 수 있다(확정이 아니라 시즌마다 절반쯤). 최종 평가에서 열에 넷은 떨어진다. 사수를 맡아 직접 가르치면(컨디션↓·정보보고 거리↑) 든든한 후배나 제자가 되고, 기본만 챙기거나 혹독하게 굴릴 수도 있다(못 버티고 떠날 수 있다)',
  '주요|수습도 떨어질 수 있다: 실력이 낮거나 평판에 흠이 있으면 수습 기간이 연장되거나 탈락·중도 포기·타사 이탈이 나온다(어려움일수록 잦다). 내가 가르친 수습이 탈락 위기면 사수로서 보증을 서거나 한 달 연장을 요청할 수 있다',
  '주요|수습이 끝나면 여러 부서로 흩어진다: 회사 수요·본인 희망·사수와의 관계로 배치가 정해지고, 우리 부서로 데려오고 싶다고 요청할 수도 있다(부장일수록 잘 통한다). 다른 부서로 간 후배는 가끔 그 부서 아이템을 귀띔해 준다. 채용한 수습도 사람이 모자란 부서로 배치될 수 있다',
  '대규모|채용에서 수습기자를 뽑을 수 있다: 인건비가 싸고(수습 기간 약 40% 할인) 3년간 잘 떠나지 않으며 빨리 크지만, 실력이 낮고 수습 기간엔 전력 외이며 선배들 시간이 들고 실수가 잦다. 경쟁 매체도 해마다 수습을 뽑는다',
  '주요|경쟁사 AI: 우리와 틀어진 광고주를 낚아채고, 우리 \"몰래 수정\"이 들통나면 사설로 저격한다. 매체마다 임금 수준이 달라 처우가 좋은 곳이 기자를 더 잘 빼 가고, 낚시 기사를 남발한 곳은 무더기 정정에 나선다',
  '주요|인력 수급 균형: 수습이 들어와 부서가 정원보다 붐비면 다른 부서 발령·이직·진로 변경이 늘고, 경쟁사도 북적이는 곳과 갓 키운 후배를 더 노린다. 회사 인원이 불어나면 고참 명예퇴직이 는다. 경쟁 매체 수습도 일부는 중도에 그만둔다',
  '수정|할 일 창의 취소·닫기·뒤로 버튼이 사라지던 문제',
  '대규모|비판 보도 뒤 줄다리기: 기사가 나가면 광고주·기관과 관계가 틀어지고, 몇 달 뒤 ① 광고로 후속 보도를 무마하려 하거나 ② 화해하고 1년간 광고를 늘리거나 ③ 광고 장기 중단·협찬 철회·자료 거부·법적 대응으로 보복한다. 받으면 돈, 거절하면 신뢰 — 무마를 받았다가 들키면 오보급 논란',
  '주요|수습 기간: 작은 매체(★1~2) 3개월 · 중견(★3~4) 4개월 · 메이저(★5) 6개월. 수습 평가 기준도 매체마다 다르다 — 큰 곳일수록 평가 문턱이 높고, 정보보고 횟수와 함께 신문·지역지는 사쓰마와리, 통신사는 속도, 방송사는 방송감, 온라인은 출고 기사, ★4 이상은 캡과의 관계, ★5는 캡 미션까지 본다. 못 채우면 한 달씩 두 번까지 연장',
  '주요|모든 할 일에 같은 자리(아래 줄) "← 뒤로"·"취소": 여러 단계로 된 할 일은 행동력을 쓰기 전까지 어느 단계에서든 이전 창으로 돌아가거나 그만둘 수 있다',
  '주요|할 일 선택지 정리: 설명을 효과 칩으로 쪼개 좋은 효과는 초록, 나쁜 효과는 빨강, 성공률은 파랑으로 보여 준다. 취소·뒤로·닫기는 아래 작은 버튼 줄로 모았고, 선택지가 많으면 2열로 놓는다. 부서 사람 목록도 이름 위주로 짧게',
  '주요|수습 건너뛰기: 진행 막대 아래 버튼(또는 메뉴 → 커리어 관리)으로 남은 수습을 자동으로 보내고 바로 발령받는다. 대신 능력치는 직접 할 때의 60%쯤만 오르고, 취재원은 2명(신뢰 낮음), 캡과의 관계도 덜 쌓인다',
  '수정|수습 사쓰마와리·뻗치기에서 기사 아이템이 너무 자주, 수습이 다루기 힘든 큰 소재로 나오던 문제: 이제 대부분 정보보고 거리·취재원·물먹은 소식이고, 아이템은 드물게 동네 사건사고급 단신만 나온다 (스토리 "물먹은 수습"은 예외)',
  '주요|관계망·사내 관계 화면 개편: 맨 위에 관계 분포 막대와 광고 중단·자료 거부·이번 달 광고 요약, 분류 버튼(정부·기관/광고주/정당·인물/주의/광고 집행 임박), 한 줄짜리 목록과 관계 막대 — 누르면 자세히 펼쳐진다. 간소화 모드는 "나" 탭에 관계 한눈에 보기 카드',
  '대규모|광고 집행 주기: 기관·기업 광고가 매달 · 2개월마다 · 분기마다 · 반년마다 · 1년에 한 번 등 곳마다 다른 주기로 몰아서 들어온다(정부 기관은 주로 반기·연 단위). 1년 총액은 그대로라 재정 평균은 같고, 달마다 들쭉날쭉하다. 관계망에 주기·1회 금액·다음 집행 시기가 나오고, 회사 탭에 이번 달 들어온 광고 내역이 보인다',
  '주요|메뉴를 2열 버튼 8개로 줄이고, 모드 전환·결과 창·팁·소리는 "설정"으로, 결산·새 커리어는 "커리어 관리"로 모았다',

function patchNotes(cat){cat=cat||'전체';const cats=['전체','대규모','주요','수정'];

  const [v0,t0,l0,d0,h0]=PATCH[0]||[];
  const hero=PATCH.length?`<div class="pnhero"><div class="pnv">v${v0}<small>${d0||''}</small></div><div class="pnt">${esc(t0)}</div>${h0?`<ul class="pnhi">${h0.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`:'';
  openModal('업데이트 내역',`${hero}<div class="acat" style="margin:10px 0">${cats.map(c=>`<button class="achip" data-pnc="${esc(c)}" aria-pressed="${c===cat}" style="--c:var(--sodium)">${esc(PN_CAT[c]||c)}</button>`).join('')}</div>
   ${PATCH.map(([v,t,l,dt],i)=>{const ls=l.map(line).join('');if(!ls)return '';return `<details class="card pnd"${i===0||cat!=='전체'?' open':''}><summary><b>v${v}</b> · ${esc(t)} <small style="color:var(--mute)">${dt||''} · ${l.length}개</small></summary><ul class="pnl">${ls}</ul></details>`;}).join('')||'<p class="empty">해당 분류 내역이 없다.</p>'}`);

function statTitle(k){const f=STAT_FX[k];return f?`${STN[k]} — ${f[0]}: ${f[2].join(' / ')}`:STN[k];}
function statTier(v){return v>=80?'최상급':v>=65?'뛰어남':v>=50?'쓸 만함':v>=35?'보통 이하':'약점';}
function statInfo(k){const f=STAT_FX[k];if(!f)return;const v=Math.round(S.st[k]);
  openModal(`${STN[k]} · ${f[0]}`,`<div class="statrow" style="margin:0 0 10px"><span>지금</span>${bar(v)}<span class="num">${v}</span></div><p class="lede">${f[1]}. 지금은 <b>${statTier(v)}</b>.</p><div class="sec">오르면 이렇게 된다</div><ul class="tpts">${f[2].map(x=>`<li>${x}</li>`).join('')}</ul><div class="sec">이렇게 키운다</div><p class="hint" style="margin:0">${f[3]} 같은 일을 할수록 오른다. 매년 연차가 쌓여도 조금씩 오른다.</p>`);}
function statPreview(){const b=bonusOf();return `<div class="kv" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${Object.keys(STN).map(k=>{const v=ST0[k]+(b[k]||0);const d=b[k]||0;return `<div title="${esc(statTitle(k))}"><span>${STN[k]} · ${STAT_FX[k]?STAT_FX[k][0]:''}</span><b>${v}</b> <span style="display:inline;color:${d>0?'var(--good)':d<0?'var(--red)':'var(--mute)'}">${d>0?'+'+d:d<0?d:''}</span></div>`;}).join('')}</div>`;}

function smbOffers(){
  const pool=shuffle(OUTLETS.filter(o=>o.p<=3));const picks=[];const seen=new Set();for(const o of pool){if(picks.length>=5)break;if(seen.has(o.type)&&chance(.6))continue;seen.add(o.type);picks.push(o);}
  S.scene='interview';drawScene();
  openModal('수시 채용 합격',`<p class="lede">중소·중견 매체 ${picks.length}곳에서 "바로 출근할 수 있느냐"는 연락이 왔다.</p><p>작은 곳일수록 일은 많고 월급은 적지만, 일찍 단독을 쥘 기회도 있다. 입사 1년 뒤부터 이직할 수 있다.</p>`,picks.sort((a,b)=>b.p-a.p).map(o=>({label:`${o.n} 입사`,sub:`${TYPES[o.type].n} · ${LEAN[o.lean]} · ${'★'.repeat(o.p)} · 수습 실수령 월 ${payOf(o,0)}만 원 · 부서 ${o.depts.length}개`,fn:()=>{join(o);return false;}})).concat([{label:'다시 고른다',cls:'ghost',fn:()=>{S.phase='create';}}]));
}
function startExam(){
  const ap=S.apply.map(id=>OUTLETS.find(o=>o.id===id));const sum=Object.values(S.st).reduce((a,b)=>a+b,0);
  const res=ap.map(o=>({id:o.id,doc:chance(clamp(.97-o.p*.11+sum/700-DF().need/100,.15,.95))}));
  S.exam={res,quiz:0,right:0,qs:drawQuiz(S.simple?5:10),iv:[]};
  S.scene='interview';drawScene();
  const pass=res.filter(r=>r.doc);
  openModal('서류 전형 결과',`<ul class="feed">${res.map(r=>{const o=OUTLETS.find(x=>x.id===r.id);return `<li class="${r.doc?'g':'r'}">${o.n} — ${r.doc?'서류 합격':'불합격'}</li>`;}).join('')}</ul>`,
    [pass.length?{label:'필기시험 보러 가기',sub:'언론사 공통 상식·논술',fn:()=>{quizStep(0);return false;}}:{label:'다시 지원서를 쓴다',fn:()=>{S.retries++;for(const k of ['kno','wri'])gain(k,4);S.apply=[];}}]);
}
function quizStep(i,last){
  const E=S.exam;const n=E.qs.length;
  if(i>=n){if(E.practice)return practiceEnd();return ivStep(0);}
  const q=E.qs[i];
  openModal(`${E.practice?'상식 퀴즈 연습':'필기시험'} · ${q.c} ${i+1}/${n}`,`${last?`<p class="${last.ok?'fx':'warn'}">${last.ok?'정답!':`오답 — 정답은 "${esc(last.a)}"`}</p>`:''}<p class="hint" style="margin:0 0 6px">정답 ${E.right}/${i}</p><p class="lede">${esc(q.q)}</p>`,q.o.map(o=>({label:esc(o),fn:()=>{const ok=o===q.a;if(ok){E.quiz+=100/n;E.right++;}quizStep(i+1,{ok,a:q.a});return false;}})));
}
function practiceStart(){S.exam={practice:true,quiz:0,right:0,qs:drawQuiz(10)};S.scene='interview';drawScene();quizStep(0);}
function practiceEnd(){

  openModal('상식 퀴즈 결과',`<p class="lede">10문제 중 <b>${r}</b>개 정답 — ${g}</p><p class="hint">문제 은행 ${QB.length}문항 · 언론·경제·한국사·국어·과학·지리·세계·문화·스포츠·사회에서 골고루 나온다.</p>`,[{label:'한 번 더 풀기',fn:()=>{practiceStart();return false;}},{label:'닫기',cls:'ghost'}]);
}

function drawIV(o){const t=IVQ_TYPE[o.type]||IVQ_TYPE.daily;return [pick(IVQ_COMMON.slice(0,2)),pick(IVQ_COMMON.slice(2)),pick(t)].concat(shuffle(IVQ_POOL).slice(0,2));}
function ivTag(k,o){const fast=['wire','ch','online','sports','tv'].includes(o.type),deep=['daily','weekly','eng','econ','jp'].includes(o.type);
  switch(k){case 'fit':return o.lean!=='neu'?10:3;case 'bal':return o.lean==='neu'?10:5;case 'integ':return deep?9:7;case 'speed':return (fast?10:4)+S.st.sta/12;case 'check':return deep?10:6;case 'report':return 6;
   case 'type':return 9;case 'money':return 2;case 'aff':return o.depts.some(d=>catOf(d).includes(MAJORS[S.major].aff))?9:4;case 'ethic':return 8;case 'team':return 7;case 'grit':return 7;case 'story':return 6+S.st.wri/15;
   case 'data':return 4+(S.st.dat||40)/10;case 'lang':return (['eng','wire'].includes(o.type)||o.depts.includes('int')?6:3)+S.st.lng/12;case 'local':return o.type==='local'?11:5;case 'digital':return ['online','ch','tv'].includes(o.type)?10:6;case 'net':return 5+S.st.net/15;case 'cliche':return 3;case 'bad':return 0;}return 5;}

function ivStep(i){
  const E=S.exam;if(!E.iv)E.iv=[];
  if(!E.ivq){const ap=(S.apply||[]).map(id=>OUTLETS.find(o=>o.id===id)).filter(Boolean);E.ivq=drawIV(ap.length?pick(ap):OUT()||OUTLETS[0]);if(S.simple)E.ivq=E.ivq.slice(0,3);}
  if(i>=E.ivq.length)return examResult();
  const q=E.ivq[i];
  openModal(`면접 · 질문 ${i+1}/${E.ivq.length}`,`<p class="lede">면접관: "${esc(q[0])}"</p><p class="hint">정답은 없다. 지원한 매체의 성격(속보형·심층형·논조·지역)에 따라 좋게 보는 답이 다르다.</p>`,shuffle(q[1]).map(([l,k])=>({label:l,fn:()=>{E.iv[i]=k;ivStep(i+1);return false;}})));
}
function ivScore(o){const iv=S.exam.iv||[];if(!iv.length)return 15;let s=iv.reduce((a,k)=>a+ivTag(k,o),0)*3/iv.length;
  if(o.type==='eng')s+=S.st.lng/6-6;return s;}
function examResult(){
  const E=S.exam;const pass=E.res.filter(r=>r.doc).map(r=>{const o=OUTLETS.find(x=>x.id===r.id);const sc=E.quiz*.35+S.st.wri*.3+S.st.kno*.2+ivScore(o)+R(-6,6);return{o,sc,ok:sc>=35+o.p*7+DF().need};});
  if(E.iv[0]==='integ')apply({trust:5});
  const ok=pass.filter(p=>p.ok);
  openModal('최종 합격 발표',`<p>필기 점수 ${E.quiz}점.</p><ul class="feed">${pass.map(p=>`<li class="${p.ok?'g':'r'}">${p.o.n} (${TYPES[p.o.type].n}) — ${p.ok?'최종 합격':'불합격'}</li>`).join('')}</ul>${ok.length?'<p>어디로 갈까?</p>':'<p>전원 불합격. 1년 더 준비하기로 한다. (상식·필력 상승)</p>'}`,
    ok.length?ok.map(p=>({label:`${p.o.n} 입사`,sub:`${TYPES[p.o.type].n} · ${LEAN[p.o.lean]} · 수습 실수령 월 ${payOf(p.o,0)}만 원`,fn:()=>{join(p.o);return false;}})):[{label:'다시 도전한다',fn:()=>{S.retries++;gain('kno',6);gain('wri',4);S.apply=[];}}]);
}
function join(o){

function founderStatMonth(lines){if(!S.fst)fstInit();const c=S.co,l=c.last||{};
  const bonus=(l.ad||0)*(fs('sales')-40)/400+(l.cost||0)*(fs('biz')-40)/500+(S.syndic&&S.syndic.due>S.turn?S.syndic.v:0);c.cash+=bonus;
  c.bT+=(fs('dig')-40)/6000;c.bS+=(fs('integ')-40)/8000;c.q=clamp(c.q+(fs('edit')-50)/60,10,100);S.trust=clamp(S.trust+(fs('integ')-S.trust)*.03,0,100);
  S.team.forEach(t=>t.skill=clamp(t.skill+fs('lead')/250,0,95));
  const st=S.fStrat&&S.fStrat.due>S.turn?S.fStrat.k:null;if(st==='digital')c.bT+=.01;if(st==='inv'){c.q+=1;c.cash-=.1;}if(st==='local')c.bS+=.008;if(st==='profit'){c.cash+=(l.ad||0)*.06;c.q-=.4;}
  if(Math.abs(bonus)>=.05)lines.push({c:bonus>0?'g':'r',t:`발행인 역량 효과 (영업·경영·제휴) ${bonus>0?'+':''}${f1(bonus)}억`});
  if(S.equity!=null&&S.equity<50&&chance(.15))lines.push({c:'r',t:`지분 ${S.equity}% — 이사회에서 "발행인 교체" 얘기가 나왔다.`});}
function fstBox(){if(!S.fst)fstInit();return FSTG.map(([g,ks])=>`<div class="sec">${g}</div>${ks.map(k=>`<div class="statrow" title="${FSTD[k]}"><span>${FSTN[k]}</span>${bar(S.fst[k])}<span class="num">${Math.round(S.fst[k])}</span></div><p class="hint" style="margin:-4px 0 6px 84px;font-size:11.5px">${FSTD[k]}</p>`).join('')}`).join('')+`<div class="sec">지분</div><p class="hint" style="margin:0">내 지분 ${S.equity??100}%${S.investor?` · 투자자 ${S.investor===2?'대기업 계열':'재무적 투자자'}`:''}</p>`;}

const ACT_STAT={sasu:'sta',hari:'sta',report:'wri',drink:'cha',pitch:'kno',beat:'net',source:'net',discover:'inv',invest:'inv',write:'wri',desk:'ver',plan:'kno',recruit:'cha',column:'wri',front:'hed',direction:'kno',campaign:'dat',adsales:'cha',digital:'dat',hire:'cha',event:'net',colleague:'cha',meeting:'kno',tour:'cha',taskforce:'inv',breaking:'spd',portal:'net',facility:'dat',network:'net',adsell:'cha',special:'inv',personnel:'cha',life:'men',rest:'sta'};
function judgment(){return S.simple?95:S.founder?fs('vis'):(S.st.kno+S.st.ver)/2;}
function recommendStat(){const j=judgment();const D=S.rec;
  if(!D||D.t!==S.turn){S.rec={t:S.turn,show:S.simple||chance(clamp(.35+j/130,.35,.95)),acc:clamp(.5+j/140,.5,.95),roll:Math.random()};}
  const R0=S.rec;if(!R0.show)return null;const ok=id=>rankActs().includes(id)&&!why(id);
  const best=recommend();if(best&&R0.roll<R0.acc)return best;
  const cand=rankActs().filter(ok).filter(id=>id!=='rest'||S.hp<50);if(!cand.length)return best;
  const val=id=>S.founder?(FST_GAIN[id]?fs(FST_GAIN[id]):30):(ACT_STAT[id]?S.st[ACT_STAT[id]]:30);
  return cand.sort((a,b)=>val(b)-val(a))[0];}

function crisisMonth(Q){if(S.pendFlaw&&chance(.15)){S.pendFlaw--;const m=S.team.find(x=>x.flaw);if(m){m.flaw=null;Q.push(()=>openModal('뽑은 사람의 과거',`<p class="lede">${esc(m.name)} 기자의 전 직장 문제가 업계에 돌았다. 채용 때 평판 조회에서 걸러냈어야 했다.</p>${fxLine(apply({eval:-1.5,trust:-1}))}`));}}if(S.rank===0)return;const k=CK();if(S.story&&chance(.5))return;const p=((S.simple?.08:.18)+(S.trust<40?.05:0)+(S.eval<45?.05:0))*(DF().crisis||1);if(!chance(p))return;
  const el=CRISES.filter(c=>{try{return c.c();}catch(e){return false;}});if(!el.length)return;let t=el.reduce((a,e)=>a+e.w,0)*Math.random();for(const e of el){t-=e.w;if(t<=0){Q.push(()=>{let ok=true;try{ok=e.c();}catch(x){ok=false;}if(ok)return e.run();closeModal();});break;}}
  if(S.promise&&S.promise.due<=S.turn){if(S.scoops<=S.promise.sc)Q.push(()=>openModal('약속을 못 지켰다',`<p class="lede">부장: "단독 가져온다며?"</p>${fxLine(apply({eval:-4*k}))}`));S.promise=null;}
  if(S.coLoan>0){S.co.cash-=S.coLoan*.01;}
}

const AU={ctx:null,on:{bgm:true,sfx:true},vol:{bgm:.5,sfx:.7},mood:null,bus:null,step:0,next:0,timer:null,noise:null,mel:null,bar:0};

function auInit(){if(AU.ctx)return AU.ctx;const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  try{const c=new C();AU.ctx=c;const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(c.destination);
    AU.master=comp;AU.bgmG=c.createGain();AU.sfxG=c.createGain();AU.bgmG.connect(comp);AU.sfxG.connect(comp);
    const d=c.createDelay(1);d.delayTime.value=.27;const fb=c.createGain();fb.gain.value=.3;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;const wet=c.createGain();wet.gain.value=.25;
    d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(wet);wet.connect(AU.bgmG);AU.echo=d;
    const len=c.sampleRate;const b=c.createBuffer(1,len,c.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;AU.noise=b;
    auVol();}catch(e){AU.ctx=null;}return AU.ctx;}
function auVol(){if(!AU.ctx)return;const t=AU.ctx.currentTime;AU.bgmG.gain.setTargetAtTime(AU.on.bgm?AU.vol.bgm*.55:0,t,.25);AU.sfxG.gain.setTargetAtTime(AU.on.sfx?AU.vol.sfx:0,t,.05);}
const mtof=m=>440*Math.pow(2,(m-69)/12);

function vTone(dest,o){const c=AU.ctx;const t=o.t,d=o.d||.3;const os=c.createOscillator();const g=c.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(o.f,t);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+(o.gl||d));if(o.det)os.detune.value=o.det;let n=os;
  if(o.fl){const bq=c.createBiquadFilter();bq.type=o.fl.type||'lowpass';bq.frequency.setValueAtTime(o.fl.f,t);if(o.fl.f2)bq.frequency.exponentialRampToValueAtTime(o.fl.f2,t+d);bq.Q.value=o.fl.q||1;os.connect(bq);n=bq;}
  const a=o.a||.005,v=o.v||.2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);if(o.s){g.gain.setValueAtTime(v,t+Math.max(a,d-o.s));}g.gain.exponentialRampToValueAtTime(.0001,t+d);
  n.connect(g);g.connect(dest);if(o.wet&&AU.echo){const w=c.createGain();w.gain.value=o.wet;g.connect(w);w.connect(AU.echo);}os.start(t);os.stop(t+d+.05);}
function vNoise(dest,o){const c=AU.ctx;const t=o.t,d=o.d||.1;const s=c.createBufferSource();s.buffer=AU.noise;const bq=c.createBiquadFilter();bq.type=o.ft||'highpass';bq.frequency.setValueAtTime(o.f||6000,t);if(o.f2)bq.frequency.exponentialRampToValueAtTime(o.f2,t+d);bq.Q.value=o.q||.8;
  const g=c.createGain();const v=o.v||.1;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.002));g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(bq);bq.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+d+.05);}

function bgmMood(){if(!S)return 'title';if(S.phase==='title')return 'title';if(S.phase==='create'||S.phase==='apply')return 'exam';if(S.phase==='end')return 'ending';

function bgmUpdate(){if(!AU.ctx)return;const m=bgmMood();if(m===AU.mood)return;AU.mood=m;const c=AU.ctx,t=c.currentTime;
  if(AU.bus){const old=AU.bus;old.gain.setTargetAtTime(0,t,.5);setTimeout(()=>{try{old.disconnect();}catch(e){}},3000);}

function melPhrase(sg){const L=[];let p=R(0,4);for(let b=0;b<4;b++){const ch=sg.prog[b];const tones=C7[ch[1]].slice(0,4).map(x=>ch[0]+12+x);const row=[];
  for(let i=0;i<16;i++){const on=sg.melD>=1?(i%8===0||(i===12&&chance(.3))):(i%2===0&&chance(i%4===0?.75:.4));if(on){p=clamp(p+R(-2,2),0,tones.length*2-1);row.push(tones[p%tones.length]+12*Math.floor(p/tones.length));}else row.push(null);}L.push(row);}return L;}

  if(AU.next<c.currentTime-.3)AU.next=c.currentTime+.05;

    if(i===0&&bar===0&&(!AU.mel||AU.bar%2===0))AU.mel=sg.mel?melPhrase(sg):null;

    if(sg.walk){if(i%4===0){const w=[0,ch[1],ch[2],ch[1]+2][i/4];INS.bass(B,t,root-12+w,sp*3.6);}}

function sfxFor(title,body){const s=title+' '+String(body||'').replace(/<[^>]+>/g,' ').slice(0,200);const T=title;
  if(/불합격|오보|소송|징계|경고장|해고|좌천|물먹|낙종|실패|파산|정정보도|문책|감봉|불발|사과문|탈락|퇴짜/.test(T))return 'fail';
  if(/승진|인사 발령|최종 합격|합격|수상|클리어|창간|입사 확정|엔딩|결산/.test(T))return 'fanfare';
  if(/대특종|특종|단독/.test(T))return 'scoop';
  if(/속보|긴급|사건|사고|재난|비상|위기|폭로|압수수색/.test(T))return 'alarm';
  if(/제보|전화|연락|문자|메시지/.test(T))return 'phone';
  if(/출고|송고|기사|데스킹|원고/.test(T))return 'type';
  if(/광고|매출|월급|투자|계약|수익|자금|돈/.test(T))return 'coin';
  if(/결재|인사|발령|채용/.test(T))return 'stamp';
  if(/사진|현장|포토/.test(T))return 'camera';
  if(/술|회식|만남|대화|동료|선배|후배/.test(T))return 'chat';
  if(/성공|확인|칭찬|1면|포털 메인|호평|축하/.test(s))return 'success';
  return 'pop';}

function medCheck(it,clip,unv,W){if(!it||!it.subj||S.story==='rookie')return;const D=DF();
  if(!unv&&!(it.adv&&!(W.rb&&it.rebut==='got'))&&W.head!=='bait')return;let p=.01+unv*.06+(!(W.rb&&it.rebut==='got')&&it.adv?.05:0)+(W.head==='bait'?.06:0)+(clip.imp>=40?.04:0)+(it.excl?.02:0);
  p*=(D.legal||1)*(hasF('fact')?.7:1)*(S.simple?.5:1)*otr('legal');if(!chance(clamp(p,0,.6)))return;
  S.medQ=S.medQ||[];S.medQ.push({h:clip.h,subj:it.subj,due:S.turn+R(4,8),unv,rb:!!(W.rb&&it.rebut==='got'),q:clip.q,excl:it.excl,imp:clip.imp});}
function medPen(){return S.simple?.6:1;} // 난이도 배율은 apply()에서 신뢰·평판에 붙는다
function medTick(Qx){if(S.medQ&&S.medQ.length){const due=S.medQ.filter(m=>m.due<=S.turn);S.medQ=S.medQ.filter(m=>m.due>S.turn);due.slice(0,1).forEach(m=>Qx.push(()=>mediation(m)));if(due.length>1)S.medQ.push(...due.slice(1).map(m=>({...m,due:S.turn+4})));}
  if(S.suitQ&&S.suitQ.length){const due=S.suitQ.filter(m=>m.due<=S.turn);S.suitQ=S.suitQ.filter(m=>m.due>S.turn);due.slice(0,1).forEach(m=>Qx.push(()=>lawsuit(m)));}}
function medLoss(m,kind){const k=medPen();const corp=S.rank>=4||S.founder;
  if(kind==='correct'){S.errors++;S.lastError=S.turn;(S.errT=S.errT||[]).push(S.turn);if(S.errT.length>20)S.errT.shift();const dmg=m.unv>=2?+(R(3,15)/100*k).toFixed(2):0;if(dmg&&S.co)S.co.cash-=dmg;log(`언론중재위 직권조정: 「${m.h}」 정정보도${dmg?` · 배상 ${f1(dmg)}억`:''}`);tick(`언론중재위, ${OUT().n} 「${m.h.slice(0,18)}…」 정정보도 결정`);

  if(kind==='reply'){log(`언론중재위 조정 성립: 「${m.h}」 반론보도 게재`);return apply({trust:-1.2*k,eval:-.8*k});}
  return '';}

function giverPool(){const L=[];const add=(name,rel,kind,ref)=>{if(name&&name!==S.name&&!L.some(x=>x.name===name))L.push({name,rel:rel||0,kind,ref});};
  (S.cols||[]).filter(c=>['peer','senior','junior','fstaff','cofound','mentor'].includes(c.role)).forEach(c=>add(c.name,c.rel,colRole(c),c));
  if(S.rank<=1&&!S.founder)deptMates().forEach(m=>add(m.name,m.rel||10,m.role||'같은 부서',m));
  if(S.rank>=2)(S.team||[]).slice(0,6).forEach(m=>add(m.name,m.rel||20,'부서원',m));return L;}

// ===== 같은 부서 사람들: 상호작용 · 부서 규모 효과 · 부서 이벤트 =====
function deptPeople(){if(S.founder||S.rank>=2)return (S.team||[]).slice(0,14);return deptMates().filter(m=>m.name!==S.name);}
function mRel(m,v,why){if(!m)return;if(v>0&&S.st)v*=(0.85+S.st.cha/260);m.rel=clamp(Math.round((m.rel??20)+v),-50,100);if(why){m.hist=m.hist||[];m.hist.unshift(`${dateShort()} ${why}`);if(m.hist.length>3)m.hist.pop();}}
function mRole(m){if(m.rk!=null)return '수습';if(S.founder)return '기자';if(S.rank>=2)return (MR[m.r||0]||'기자');return m.role||MR[m.r||0]||'기자';}
function myY(){return Math.floor(S.turn/YW);}
function relWord(v){v=v??20;return v>=60?'둘도 없는 사이':v>=35?'가까움':v>=10?'무난':v>=-10?'서먹함':'불편함';}
function deptStat(){const P=deptPeople();const n=P.length+1;const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  return{n,yrs:avg(P.map(m=>m.yrs||1)),sk:avg(P.map(m=>m.skill||30)),mood:avg(P.map(m=>m.rel??20)),total:S.co?S.co.staff:OUT().staff};}
// 부서 규모·분위기·회사 규모 효과 (배율) — otr()에 함께 곱해진다
function deptFx(){if(!S||S.phase!=='game'||!S.outlet)return {};if(S._dfx&&S._dfx.t===S.turn&&S._dfx.r===S.rank&&S._dfx.d===S.dept)return S._dfx.v;const d=deptStat();const v={ap:0,list:[]};const mul=(k,x)=>{v[k]=(v[k]||1)*x;};
  {const DF0=!S.founder&&S.rank<4&&DEPT_FX[S.dept];if(DF0){for(const k in DF0[2])mul(k,DF0[2][k]);v.list.push(['부서 특성 · '+DF0[0],DF0[1]+' · 잘 크는 능력치: '+Object.keys(DF0[3]).map(k=>STN[k]).join('·')]);}}
  if(d.n<=3){v.ap+=1;mul('item',1.08);mul('hp',1.1);v.list.push(['일당백 부서',`${d.n}명뿐이라 혼자 여러 출입처를 맡는다 · 행동력 +1 · 아이템↑ · 몸은 더 힘들다`]);}
  else if(d.n>=10){mul('item',.93);mul('hp',.94);mul('pick',.95);v.list.push(['큰 부서',`${d.n}명 · 출입처가 겹쳐 아이템이 덜 돌지만 서로 대신 뛰어 줄 수 있다 · 승진 경쟁↑`]);}
  else if(d.n>=7){mul('hp',.97);v.list.push(['넉넉한 부서',`${d.n}명 · 급할 때 대신 뛰어 줄 사람이 있다 · 컨디션 소모 조금↓`]);}
  if(d.n<=4&&!S.founder){mul('eval',1.05);v.list.push(['눈에 띄는 자리','사람이 적어 데스크 눈에 잘 띈다 · 평가가 조금 더 오른다']);}
  if(d.mood>=35){mul('rel',1.1);mul('hp',.95);v.list.push(['분위기 좋음',`부서 평균 관계 ${Math.round(d.mood)} · 관계가 더 잘 쌓이고 덜 지친다`]);}
  else if(d.mood<=0){mul('hp',1.08);mul('eval',.95);v.list.push(['분위기 냉랭',`부서 평균 관계 ${Math.round(d.mood)} · 더 지치고 평가도 덜 오른다`]);}
  if(d.sk>=52){mul('grow',1.06);v.list.push(['실력자들 틈',`부서 평균 실력 ${Math.round(d.sk)} · 옆에서 보고 배우는 게 많다 · 성장↑`]);}
  if(d.total>=200){mul('fame',1.06);mul('heat',.95);v.list.push(['큰 간판',`기자 ${d.total}명 회사 · 이름값으로 평판이 더 오르고 취재망이 두텁다`]);}
  else if(d.total<=25){mul('fame',.94);mul('item',1.05);v.list.push(['작은 회사',`기자 ${d.total}명 · 이름값은 약하지만 기회는 많다`]);}
  S._dfx={t:S.turn,r:S.rank,d:S.dept,v};return v;}
function deptBox(){const d=deptStat(),f=deptFx();return `<div class="card" style="border-color:rgba(119,166,255,.35)"><div class="t">${S.founder?'편집국':DEPTS[S.dept].n} 현황</div><div class="meta"><span>인원 ${d.n}명 (회사 기자 ${d.total}명)</span><span>평균 ${Math.round(d.yrs)}년 차</span><span>평균 실력 ${Math.round(d.sk)}</span><span>분위기 ${relWord(d.mood)} (${Math.round(d.mood)})</span></div>${(f.list||[]).length?`<ul class="pnl" style="margin-top:6px">${f.list.map(([a,b])=>`<li><span class="tg pc">${a}</span>${esc(b)}</li>`).join('')}</ul>`:''}<p class="hint" style="margin:6px 0 0">할 일의 "부서 사람들과"에서 동료와 밥을 먹고, 노하우를 배우고, 같이 취재할 수 있다.</p></div>`;}
// 행동: 부서 사람들과
RUN.deptlife=function(){const P=deptPeople();if(!P.length){toast('같은 부서에 사람이 없다');return;}
  openModal(S.founder?'구성원과 시간 보내기':'부서 사람들과',`<p>누구와 시간을 보낼까? 관계가 좋을수록 도움을 더 받는다.</p>`,P.slice().sort((a,b)=>(b.rel??20)-(a.rel??20)).map(m=>({label:`${m.name}`,tag:mRole(m),sub:`${relWord(m.rel)} ${Math.round(m.rel??20)} · ${myrs(m)}년 차 · ${npcAge(m)}세 · 실력 ${Math.round(m.skill)}${m.hist&&m.hist[0]?' · 최근: '+m.hist[0]:''}`,fn:()=>{deptTalk(m);return false;}})).concat([{label:'취소',cls:'ghost'}]));};
function deptTalk(m){const me=myY(),sen=(m.yrs||1)>me+2,jun=(m.yrs||1)<me-1||S.rank>=2||S.founder;const best=m.st?Object.entries(m.st).sort((a,b)=>b[1]-a[1])[0][0]:'inv';
  const unc=S.items.find(i=>i.facts.some(f=>!fOK(f)));const rel=m.rel??20;const C=[];
  C.push({label:'점심·커피',sub:'관계↑ · 컨디션 조금↑',fn:()=>{spend(1,0);S.hp=clamp(S.hp+3,0,100);mRel(m,R(6,10),'점심');S.money-=1;toast(`${m.name}와 밥을 먹었다 · 관계 ${relWord(m.rel)}`);}});
  if(sen)C.push({label:'노하우를 묻는다',sub:`${m.name}의 장기 「${STN[best]}」을 배운다`,fn:()=>{spend(1,3);gain(best,1.2+(rel>=35?.6:0));mRel(m,3,'노하우 전수');toast(`${STN[best]} 감을 조금 익혔다`);}});
  if(jun)C.push({label:'요령을 가르쳐 준다',sub:'상대 실력↑ · 관계↑'+(S.rank>=2?' · 평가 조금↑':''),fn:()=>{spend(1,4);m._dv=(m._dv||0)+1.5;m._fy=null;fitSk(m);mRel(m,7,'가르쳐 줌');gain('int',.2);gain('cha',.2);if(S.rank>=2)apply({eval:.4});toast(`${m.name} 실력이 조금 늘었다`);}});
  if(unc)C.push({label:`같이 취재하자고 한다 — 「${unc.title.slice(0,16)}…」`,sub:`실력 ${Math.round(m.skill)} · 성공하면 사실 하나 확인, 바이라인 공동`,fn:()=>{spend(1,5);const f=unc.facts.find(x=>!fOK(x));if(chance(.3+m.skill/150+(rel>=35?.1:0))){f.conf=f.need;f.via.push(`${m.name} 공동 취재`);unc.co=unc.co||m.name;mRel(m,4,'공동 취재');toast(`${m.name} 덕에 「${f.t.slice(0,18)}」 확인`);}else{mRel(m,1,'공동 취재');toast('같이 뛰었지만 이번엔 허탕');}}});
  if(S.rank<=3&&!S.founder)C.push({label:'다음 원고를 봐 달라고 한다',sub:'다음 기사 완성도↑ (상대 실력만큼)',fn:()=>{spend(1,2);S.peerRev={n:m.name,b:clamp(Math.round((m.skill-28)/5),1,8)};mRel(m,2,'원고 검토');toast(`${m.name}가 다음 원고를 봐 주기로 했다`);}});
  C.push({label:'출입처 정보를 나눈다',sub:'관계가 좋을수록 아이템·취재원이 나온다',fn:()=>{spend(1,3);const p=.15+Math.max(0,rel)/220;if(chance(p*glut())){const it=makeItem(S.dept,{excl:chance(.3),pre:1});it.from=m.name;S.items.push(it);mRel(m,2,'정보 교환');toast(`${m.name}: "이거 한번 봐 봐." → 「${it.title}」`);}else if(chance(.35)){const s=addSource(S.dept,R(15,30));mRel(m,2,'취재원 소개');toast(`${m.name}가 ${s.name} ${s.role}을 소개해 줬다`);}else{mRel(m,2,'정보 교환');toast('서로 근황만 나눴다');}}});
  if(S.rank>=2&&S.rank<=3&&(m.yrs||1)<me&&S.protege!==m.name)C.push({label:'제자로 삼는다',sub:`${S.protege?`지금 제자 ${S.protege} 대신 · `:''}매달 실력이 크고, 단독을 내면 내 평판도 오른다`,fn:()=>{spend(1,2);S.protege=m.name;mRel(m,10,'제자');toast(`${m.name}를 제자로 삼았다`);}});
  C.push({label:'고민을 들어 준다',sub:'관계↑↑ · 컨디션 조금↓',fn:()=>{spend(1,4);mRel(m,R(10,15),'고민 상담');gain('men',.3);toast(`${m.name}가 "고맙다"고 했다`);}});
  C.push({label:'뒤로',cls:'ghost',fn:()=>{RUN.deptlife();return false;}});
  openModal(`${m.name} · ${mRole(m)}`,`<p class="lede">${myrs(m)}년 차 · ${npcAge(m)}세 · 실력 ${Math.round(m.skill)} · 관계 ${relWord(m.rel)} (${Math.round(rel)})</p>${m.hist&&m.hist.length?`<p class="hint">최근: ${m.hist.map(esc).join(' · ')}</p>`:''}`,C);}

  if(S.rank===0&&S.mission){parts.push(`<div class="card rkc"><div class="t">캡의 이달 미션 <small>${moTxt(Math.max(0,4-(S.turn-S.mission.t)))} 남음</small></div><div class="meta">${S.mission.g.map(x=>`<span class="${x.c>=x.need?'tag ok':''}">${x.n} ${Math.min(x.c,x.need)}/${x.need}</span>`).join('')}</div><p class="hint" style="margin:4px 0 0">다 하면 평가↑·캡 관계↑, 하나도 못 하면 평가↓.</p></div>`);}
  if(S.rank>=1&&S.rank<=2){const v=(S.beatM||{})[S.dept]||0,t=beatTier();parts.push(`<div class="card rkc"><div class="t">출입처 장악도 · ${BEAT_T[t]}</div>${bar(v,'var(--good)')}<p class="hint" style="margin:4px 0 0">${DEPTS[S.dept].n} 출입처 ${Math.round(v)}/100 · 브리핑·취재원·발굴·기사로 오른다. 45 이상이면 자료가 먼저 오고, 75 이상이면 단독 귀띔이 온다. 부서를 옮기면 처음부터.</p></div>`);}
  if(S.rank>=2&&S.rank<=3){parts.push(`<div class="card rkc"><div class="t">제자 키우기 ${S.protege?`· ${esc(S.protege)}`:''}</div><p class="hint" style="margin:0">${S.protege?'제자는 매달 조금씩 크고, 가끔 단독을 내면 내 평판도 오른다.':'"부서 사람들과"에서 후배를 골라 "제자로 삼는다"를 누르자.'}</p></div>`);}
  if(S.rank===3&&S.deptBoard){parts.push(`<div class="card rkc"><div class="t">사내 부서 성적표 · ${S.deptRank}위</div><div class="meta">${S.deptBoard.map((x,i)=>`<span class="${x[0].endsWith('(우리)')?'tag so':''}">${i+1}. ${esc(x[0])} ${x[1]}</span>`).join('')}</div><p class="hint" style="margin:4px 0 0">이번 달 기사 수·완성도·부서원 실력으로 매긴다. 1위면 다음 달 행동력 +1.</p></div>`);}
  if(S.rank>=4&&S.rank<=6&&S.fwWins!=null){parts.push(`<div class="card rkc"><div class="t">1면 대결 · ${S.fwWins}승 · 지금 ${S.fwStreak||0}연승</div></div>`);}
  if(S.rank===6){parts.push(`<div class="card rkc"><div class="t">어젠다 캠페인 ${S.agenda?`· 「${esc(AGENDA[S.agenda.k][0])}」`:''}</div>${S.agenda?bar(S.agenda.p,'var(--sodium)'):''}<p class="hint" style="margin:4px 0 0">${S.agenda?(S.agenda.done?'결실을 맺었다. 새 어젠다를 정할 수 있다.':`${Math.round(S.agenda.p)}% · 편집회의·1면·특별취재팀·칼럼이 밀어 준다.`):'할 일의 "어젠다 세팅"에서 올해의 연중 기획을 정하자.'}</p></div>`);}
  if(S.rank===7&&S.kpi){parts.push(`<div class="card rkc"><div class="t">이사회 KPI <small>분기마다 보고</small></div><div class="meta"><span>월 매출 ${f1(S.kpi.rev)}억 이상</span><span>광고 점유율 ${S.kpi.share}% 이상</span><span>신뢰도 ${S.kpi.trust} 이상</span></div>${S.kpi.hist.length?`<p class="hint" style="margin:4px 0 0">지난 보고: ${S.kpi.hist.slice(-4).map(n=>n+'/3').join(' · ')}</p>`:''}</div>`);}
  return parts.length?`<div class="sec">${rankName()}의 일</div>${parts.join('')}`:'';}
F_EVENTS.push({w:4,c:()=>!S.founder&&!S.story&&S.rank>=4&&S.rank<=6&&S.comp&&S.comp.length,run:()=>frontWar()});

function scoopGrade(it,imp,q,ver){if(!it.excl)return '';if(imp>=75&&q>=60&&ver>=3)return '대특종';if(imp>=58&&q>=50)return '특종';return '단독';}
const SCOOP_BANNER={단독:['단독','var(--siren)','우리가 먼저 썼다'],특종:['특종','var(--sodium)','업계가 받아쓴다'],대특종:['대특종','var(--red)','판이 뒤집혔다'],속보:['속보','var(--good)','가장 먼저 알렸다']};

// 등급별 후속 효과: 직급 시스템·경쟁사·출입처와 맞물린다
function scoopAfter(g,it,lines){if(!g)return;const o=OUT();if(g==='특종'||g==='대특종')S.tokjong=(S.tokjong||0)+1;

let ACT_SNAP=null;
function snapNow(){const c=S.co||{};const net={};if(S.net)for(const k in S.net)net[k]=S.net[k].rel||0;
  return{ap:S.ap,hp:S.hp,money:S.money,eval:S.eval,fame:S.fame,trust:S.trust,st:{...S.st},cash:c.cash||0,q:c.q||0,subs:c.subs||0,tr:c.tr||0,items:(S.items||[]).length,src:(S.sources||[]).length,team:(S.team||[]).length,staff:c.staff||0,adRate:S.adRate||1,net};}
function snapDiff(a,b){const L=[];const add=(n,d,fmt,good=1)=>{if(Math.abs(d)<1e-6)return;const up=d>0;L.push({n,t:(up?'+':'')+fmt(d),g:(up?1:-1)*good>0});};
  const r1=x=>f1(x);
  add('행동력',b.ap-a.ap,x=>Math.round(x),1);add('컨디션',Math.round(b.hp-a.hp),x=>x,1);add('통장',Math.round(b.money-a.money),x=>x.toLocaleString('ko-KR')+'만',1);
  add(evalName(),+(b.eval-a.eval).toFixed(1),r1);add('업계 평판',+(b.fame-a.fame).toFixed(1),r1);add('신뢰도',+(b.trust-a.trust).toFixed(1),r1);
  for(const k in STN){const d=+((b.st[k]||0)-(a.st[k]||0)).toFixed(1);if(Math.abs(d)>=.1)add(STN[k],d,r1);}
  add('회사 자금',+(b.cash-a.cash).toFixed(2),x=>f1(x)+'억');add('보도 품질',+(b.q-a.q).toFixed(1),r1);
  if(a.subs)add('구독',Math.round((b.subs/a.subs-1)*1000)/10,x=>x+'%');if(a.tr)add('트래픽',Math.round((b.tr/a.tr-1)*1000)/10,x=>x+'%');
  add('아이템',b.items-a.items,x=>x+'개');add('취재원',b.src-a.src,x=>x+'명');add('인력',(b.staff-a.staff)||(b.team-a.team),x=>x+'명');
  add('광고 단가',Math.round((b.adRate-a.adRate)*100),x=>x+'%p');
  const nd=Object.keys(b.net).map(k=>[k,(b.net[k]||0)-(a.net[k]||0)]).filter(x=>Math.abs(x[1])>=1).sort((x,y)=>Math.abs(y[1])-Math.abs(x[1])).slice(0,3);
  nd.forEach(([k,d])=>{let n='관계';try{n=entName(k);}catch(e){}add(n+' 관계',Math.round(d),x=>x);});
  return L;}
function diffHTML(L){if(!L.length)return '';return `<div class="rdiff"><div class="rdh">바뀐 것</div>${L.map(x=>`<span class="rd ${x.g?'up':'dn'}"><i>${esc(x.n)}</i><b>${x.t}</b></span>`).join('')}</div>`;}

function snapInject(body,title){if(!ACT_SNAP||!S||S.phase!=='game')return body;if(/튜토리얼|도움말|메뉴|업데이트|저장|소리 설정|개발자|처음 해 보는 일/.test(title||'')||String(body||'').includes('tfig'))return body;const L=snapDiff(ACT_SNAP.s,snapNow());if(!L.length||!L.some(x=>x.n==='행동력'))return body;ACT_SNAP.shown=JSON.stringify(L);ACT_SNAP.msgs=[];return (body||'')+diffHTML(L);}
// 행동이 끝났는데 결과 창 없이 알림만 떴다면 결과 팝업을 띄운다
function snapFinish(){if(!ACT_SNAP||!S||S.phase!=='game')return false;const A=ACT_SNAP;const L=snapDiff(A.s,snapNow());const sig=JSON.stringify(L);
