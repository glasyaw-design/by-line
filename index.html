function myAge(){if(S.age0==null){S.age0=S.founder?40:26;S.ageT0=0;}return S.age0+Math.floor((S.turn-(S.ageT0||0))/YW);}
function npcAge(m){if(m.age!=null&&m.t0!=null)return m.age+Math.floor((S.turn-m.t0)/YW);const y=typeof myrs==='function'?myrs(m):(m.yrs||1);let h=0;for(const ch of String(m.name||''))h=(h*31+ch.charCodeAt(0))>>>0;return clamp(26+y+(h%4)-1,24,66);}
function retireAge(){if(S.founder)return S.retExt||AGE_FND;if(S.rank>=6)return S.retExt||AGE_EXEC;return S.retExt||AGE_RET;}
function ageLine(){const a=myAge(),r=retireAge();const left=r-a;return `${a}세${S.story?'':left<=5&&left>0?` · ${S.founder?'은퇴 고민':'정년'}까지 ${left}년`:left<=0?` · ${S.founder?'현역 연장 중':'정년 연장 중'}`:''}`;}
// 시작 나이에 따른 차이: 늦게 들어올수록 상식·친화력이 조금 높고 체력이 조금 낮다
function ageStart(){const a=S.age0||26;if(S.smode==='found'){const d=a-35;gain('net',d*.5);gain('kno',d*.4);gain('sta',-d*.4);S.fame=(S.fame||0)+d*.3;}else{const d=a-23;gain('kno',d*.8);gain('cha',d*.4);gain('sta',-d*.3);}}
function ageCheck(Qx){if(S.story||S.phase!=='game')return;const a=myAge();if(S._ageSeen===a)return;const first=S._ageSeen==null;S._ageSeen=a;if(first)return;
  if(a>=50&&!S.founder)gain('sta',-.3);if(a>=60)gain('sta',-.4);
  const R0=retireAge();
  if(!S.founder&&a===R0-2&&!S.retWarn){S.retWarn=1;if(S.simple){toast(`정년(${R0}세)까지 2년 남았다`);return;}Qx.push(()=>openModal('정년 2년 전',`<p class="lede">인사팀에서 "정년 퇴직 예정자 안내문"이 왔다. ${R0}세가 되는 해에 퇴직한다.</p><p class="hint">퇴직 전에 회사를 나와 창간할 수도 있고, 실적이 좋으면 선임기자로 남을 수도 있다.</p>`,[{label:'알겠다'}]));return;}
  if(!S.founder&&a>=R0){Qx.push(()=>retireCareer());return;}
  if(S.founder&&a>=R0)Qx.push(()=>retireFounder(a));}
function retireCareer(){const a=myAge();const exec=S.rank>=6;const canExt=!S.retExt&&(S.eval>=55||S.fame>=35||S.awards>=1);const pay=typeof payOf==='function'?payOf(OUT()):500;const sev=Math.round(pay*Math.min(36,years())/10)*10;
  openModal(exec?'임기 만료 · 퇴임':'정년퇴직',`<p class="lede">${a}세. ${exec?`${esc(OUT().n)} ${rankName()} 임기가 끝났다. 이사회가 송별사를 준비했다.`:`${years()}년 기자 생활의 마지막 출근이다. 후배들이 꽃다발과 마지막 지면을 액자로 만들어 왔다.`}</p><p>퇴직금 약 <b>${sev.toLocaleString('ko-KR')}만 원</b>.</p>`,[
   {label:exec?'퇴임한다':'정년퇴직한다',sub:'커리어 결산',fn:()=>{S.money+=sev;ending(exec?'임기 만료 퇴임':'정년퇴직');return false;}},
   ...(canExt?[{label:exec?'고문으로 2년 더 남는다':'선임기자로 2년 더 쓴다',sub:exec?'경영 자문 · 권한은 줄어든다':'촉탁 계약 · 월급은 줄고 현장 기자로 복귀',fn:()=>{S.retExt=a+2;if(!exec){S.payK=(S.payK||1)*.7;}toast(apply({eval:-1}));log(`${exec?'고문':'선임기자'}로 ${a+2}세까지 연장`);}}]:[]),
   {label:'퇴직금으로 창간한다',sub:'창간 대표는 정년이 없다 · 70세 무렵까지 현역',fn:()=>{S.money+=sev;S.retExt=null;RUN.found();return false;}}]);}
function retireFounder(a){const c=S.co;const val=+Math.max(0,(c.cash||0)+OUT().p*1.5+(S.myShare||5)/10).toFixed(1);const last=a>=AGE_FMAX;
  openModal(last?'마지막 결단':'은퇴를 생각할 나이',`<p class="lede">${a}세. ${last?'더는 미룰 수 없다. 주치의도, 가족도 이제 쉬라고 한다.':'창간 대표에게 정년은 없다. 하지만 몸이 예전 같지 않다.'}</p><p class="hint">회사 가치 추정 약 ${f1(val)}억.</p>`,[
   ...(!last?[{label:'현역으로 더 뛴다',sub:'1~2년 더 · 체력·컨디션이 해마다 떨어진다',fn:()=>{S.retExt=Math.min(AGE_FMAX,a+R(1,2));S.hp=clamp(S.hp-10,0,100);toast('아직은 내 손으로 신문을 만든다');}}]:[]),
   {label:'후배에게 대표를 물려주고 은퇴한다',sub:'신뢰가 높을수록 좋은 결말',fn:()=>{ending('대표 은퇴 · 승계');return false;}},
   {label:'회사를 매각하고 은퇴한다',sub:`매각 대금 약 ${f1(val*.6)}억 (지분 기준)`,fn:()=>{S.money+=Math.round(val*.6*10000);ending('매각 후 은퇴');return false;}}]);}
// 나이 선택 칸 (만들기 화면)
function ageGroupHTML(){if(S.smode==='story')return '';const F=S.smode==='found';const L=F?[35,38,40,43,45,48,50,55]:[23,24,25,26,27,28,29];if(S.age0==null||(F&&S.age0<35)||(!F&&(S.age0<23||S.age0>29)))S.age0=F?40:26;
  return `<div class="group"><h4>나이<small>${F?'창간 대표는 35세 이상 · 나이가 많을수록 인맥·상식↑ 체력↓':'수습 입사 23~29세 · 늦게 들어올수록 상식·친화력↑ 체력↓, 정년(60세)까지 남은 시간은 짧다'}</small></h4><div class="agech">${L.map(a=>`<button class="chip agc" data-age="${a}" aria-pressed="${S.age0===a}">${a}세</button>`).join('')}</div></div>`;}

// ===== 월급 보기 · 임금 조정 (편집국장: 편집국 수당 / 사장·창간 대표: 기본급) =====
// 사기(S.wMood 0~100)는 임금이 업계 평균보다 높으면 오르고 낮으면 떨어진다. 깎을 때는 올릴 때보다 두 배 아프다.
function npcRankM(m){if(m.rk!=null)return RANKM[0];if(m.r!=null)return RANKM[[1,2,3,4][clamp(m.r,0,3)]]||1;const r=String(m.role||'');return RANKM[/수습/.test(r)?0:/부국장/.test(r)?4:/부장|팀장|데스크/.test(r)?3:/차장|캡/.test(r)?2:1];}
function npcPay(m){const o=OUT();const y=typeof myrs==='function'&&m.t0!=null?myrs(m):(m.yrs||1);return Math.round(o.pay*otr('pay',o)*npcRankM(m)*(1+.02*y)*DF().pay/5*(S.payLv||1)*(m.payK||1))*5;}
function payTxt(m){try{return `월 ${npcPay(m).toLocaleString('ko-KR')}만`;}catch(e){return '';}}
function payroll(){const o=OUT(),c=S.co;const infl=Math.pow(1.02,Math.floor(S.turn/YW));return c.staff*(S.founder?.066:.09)*(S.payLv||1)*infl;}
function wageMood(){if(S.wMood==null)S.wMood=60;return S.wMood;}
function moodWord(v){return v>=75?'사기 충천':v>=55?'괜찮음':v>=35?'불만이 쌓인다':v>=20?'술렁인다':'폭발 직전';}
function quitBest(n,why){const L=(S.team||[]).slice().sort((a,b)=>b.skill-a.skill);const out=[];for(let i=0;i<n&&L.length>3;i++){const m=chance(.6)?L.shift():L.splice(R(0,L.length-1),1)[0];S.team=S.team.filter(x=>x!==m);S.co.staff=Math.max(1,S.co.staff-1);out.push(m.name);log(`${m.name} 기자 퇴사 — ${why}`);}if(out.length)S.co.q=clamp(S.co.q-out.length,10,100);return out;}
// 임금 바꾸기: 사기·충격·하방 경직
function setPay(nv,src){const old=S.payLv||1;nv=+clamp(nv,.7,1.5).toFixed(3);S.payLv=nv;wageMood();const d=nv-old;const peak=S.payPeak||1;
  if(d>0)S.wMood=clamp(S.wMood+d*120,0,100);
  if(d<0)S.wMood=clamp(S.wMood+d*(nv<peak?300:240),0,100);
  S.payPeak=Math.max(peak,nv);const res=[];
  if(d<=-.09){const q=quitBest(R(1,3),'임금 삭감');if(q.length)res.push(`${q.join('·')} 기자가 사표를 냈다`);apply({trust:-1.5});try{relUp(colBy('union'),-15,'임금 삭감');}catch(e){}if(S.rank===7&&!S.founder)apply({eval:-1});}
  if(d>=.1&&(S.co.last&&S.co.last.profit<0)){res.push(S.founder?'투자자들이 "이 적자에 임금 인상이냐"고 따진다':'이사회가 "적자 속 임금 인상"을 문제 삼았다');if(!S.founder&&S.rank===7)apply({eval:-1.5});S.payWarn=(S.payWarn||0)+1;}
  if(nv!==old)log(`임금 수준 ×${f1(old)} → ×${f1(nv)}${src?` (${src})`:''}`);return res;}
RUN.wage=function(){const o=OUT(),c=S.co;const pr=payroll();const L=c.last||{};const rev=L.rev||0;const ratio=rev>0?pr/rev:0;const lv=S.payLv||1;const exec=S.rank===6&&!S.founder;wageMood();
  const est=k=>{const np=pr*(k/lv);return `인건비 월 ${f1(np)}억 (${np>=pr?'+':''}${f1(np-pr)})`;};
  const sample=(S.team||[]).slice(0,3).map(m=>`${esc(m.name)} ${payTxt(m)}`).join(' · ');
  const body=`<p>임금 수준 <b>업계 평균의 ${Math.round(lv*100)}%</b> · 구성원 사기 <b>${Math.round(S.wMood)}</b> (${moodWord(S.wMood)})</p><p>인건비 월 <b>${f1(pr)}억</b>${rev?` · 매출 대비 <b style="color:${ratio>.85?'var(--red)':ratio>.65?'var(--sodium)':'var(--good)'}">${Math.round(ratio*100)}%</b>`:''} · 회사 자금 ${f1(c.cash)}억</p>${sample?`<p class="hint">예: ${sample}</p>`:''}<p class="hint">${exec?'편집국장은 편집국 수당과 성과급만 손댈 수 있고, 사장 결재가 필요하다.':'한 번에 10% 넘게 깎으면 사표가 나오고, 적자인데 크게 올리면 '+(S.founder?'투자자':'이사회')+'가 문제 삼는다. 한 번 올린 임금은 다시 깎기 더 어렵다. 인건비가 매출의 85%를 넘는 달이 이어지면 재정이 무너진다.'}</p>`;
  const ch=exec?[
   {label:'취재 수당 인상 (+5%)',sub:`사기↑ · ${est(lv*1.05)} · 사장 결재`,fn:()=>{spend(1,3);setCd('wage');if(chance(clamp(.3+S.eval/150,.3,.85))){setPay(lv*1.05,'편집국 수당');toast(`결재 통과 · 사기 ${Math.round(S.wMood)}`);}else{apply({eval:-.5});toast('사장이 "지금 그럴 때냐"며 반려했다');}}},
   {label:'특별 성과급 (한 번)',sub:`회사 자금 -${f1(c.staff*.006)}억 · 사기 크게↑`,fn:()=>{spend(1,3);setCd('wage');c.cash-=+(c.staff*.006).toFixed(2);S.wMood=clamp(S.wMood+12,0,100);toast(`성과급 지급 · 사기 ${Math.round(S.wMood)}`);}},
   {label:'야근·주말 수당 줄이기 (-5%)',sub:`인건비↓ · 사기↓↓`,fn:()=>{spend(1,3);setCd('wage');const r=setPay(lv*.95,'수당 삭감');toast(r.join(' · ')||`사기 ${Math.round(S.wMood)}`);}}
  ]:[
   ...[[.03,'소폭 인상'],[.07,'인상'],[.15,'대폭 인상']].map(([p,n])=>({label:`${n} (+${Math.round(p*100)}%)`,sub:`${est(lv*(1+p))} · 사기↑${p>=.1?' · 적자면 경영진 반발':''}`,disabled:lv>=1.5,fn:()=>{spend(1,3);setCd('wage');const r=setPay(lv*(1+p),n);toast((r.length?r.join(' · ')+' · ':'')+`사기 ${Math.round(S.wMood)}`);}})),
   {label:'동결',sub:c.last&&c.last.profit>0?'흑자인데 동결이면 불만':'사기 조금↓',fn:()=>{spend(1,3);setCd('wage');S.wMood=clamp(S.wMood-(c.last&&c.last.profit>0?6:2),0,100);toast(`임금 동결 · 사기 ${Math.round(S.wMood)}`);}},
   ...[[.05,'삭감'],[.1,'큰 폭 삭감'],[.2,'비상 삭감']].map(([p,n])=>({label:`${n} (-${Math.round(p*100)}%)`,sub:`${est(lv*(1-p))} · 사기↓↓${p>=.1?' · 사표·노조 반발':''}`,disabled:lv<=.7,fn:()=>{spend(1,3);setCd('wage');const r=setPay(lv*(1-p),n);toast((r.length?r.join(' · ')+' · ':'')+`사기 ${Math.round(S.wMood)}`);}})),
   {label:'성과급 (한 번)',sub:`회사 자금 -${f1(c.staff*.008)}억 · 사기↑ · 기본급은 그대로`,fn:()=>{spend(1,3);setCd('wage');c.cash-=+(c.staff*.008).toFixed(2);S.wMood=clamp(S.wMood+10,0,100);toast(`성과급 지급 · 사기 ${Math.round(S.wMood)}`);}}];
  openModal(exec?'편집국 수당 조정':'임금 조정',body,ch.concat([{label:'닫기',cls:'ghost'}]));};
RUN.paypol=function(){RUN.wage();};
// 매달: 사기는 임금 수준 쪽으로 천천히 움직이고, 낮으면 사람이 나가고, 인건비가 매출을 잡아먹으면 재정이 무너진다
function wageMonth(lines){if(!S.co||!(S.founder||S.rank>=6))return;const c=S.co;wageMood();const lv=S.payLv||1;
  const target=clamp(58+(lv-1)*140,10,95);S.wMood+=(target-S.wMood)*.08;
  if(S.wMood>=75)(S.team||[]).forEach(t=>t.skill+=.08);
  if(S.wMood<35&&chance(.22)){const q=quitBest(1,'처우 불만');if(q.length)lines.push({c:'r',t:`${q[0]} 기자가 처우 불만으로 회사를 떠났다 (사기 ${Math.round(S.wMood)})`});}
  if(S.wMood<20&&chance(.15)){c.q=clamp(c.q-3,10,100);c.adB-=.03;S.trust=Math.max(0,S.trust-1);lines.push({c:'r',t:'노조가 임금 문제로 제작 거부에 들어갔다. 지면이 얇아졌다'});}
  const L=c.last||{};const ratio=L.rev>0?payroll()/L.rev:0;
  if(ratio>.85){S.wageBad=(S.wageBad||0)+1;if(S.wageBad===3)lines.push({c:'r',t:`인건비가 매출의 ${Math.round(ratio*100)}%다. 이대로면 재정이 버티지 못한다`});
    if(S.wageBad>=6&&chance(.3)){S.wageBad=3;if(S.founder){c.cash-=+(c.staff*.01).toFixed(2);lines.push({c:'r',t:'은행이 대출 금리를 올렸다. 인건비 구조가 위험하다는 판단이다'});}else{apply({eval:-2});lines.push({c:'r',t:'이사회가 인건비 구조조정을 요구했다'});}}}else S.wageBad=0;
  if(c.cash<0&&lv>=.9&&chance(.25)){S.wMood=clamp(S.wMood-15,0,100);const q=quitBest(R(1,2),'임금 체불');lines.push({c:'r',t:`월급이 하루 늦게 나갔다. 임금 체불 소문이 돌고 ${q.length?q.join('·')+' 기자가 떠났다':'분위기가 얼어붙었다'}`});}}

// ===== 승진 추가 조건 · 부서 이동 조건 =====
// 직급이 오를수록 평가·평판 말고도 "그 자리에 맞는 실적"을 본다. 작은 회사는 문턱이 낮고, 간소화 모드는 핵심 하나만, 스토리는 예외.
function promoSz(){return ({1:.5,2:.6,3:.8,4:1,5:1.2}[OUT().p]||1);}
function rankArts(){const t0=S.turn-(S.inRank||0);return (S.clips||[]).filter(c=>c.turn>=t0).length;}
function promoReqs(r){if(S.story||S.founder)return [];const z=promoSz(),n=x=>Math.max(1,Math.round(x*z*(S.simple?.5:1)));const L=[];const errN=y=>(S.errT||[]).filter(t=>t>S.turn-YW*y).length;const bm=Math.max(0,...Object.values(S.beatM||{0:0}));
  if(r===1){L.push({t:`이번 직급 기사 ${rankArts()}/${n(14)}`,ok:rankArts()>=n(14)});L.push({t:`최근 1년 오보 ${errN(1)}/1건 이하`,ok:errN(1)<=1});}
  if(r===2){L.push({t:`단독 ${S.scoops||0}/${n(2)}`,ok:(S.scoops||0)>=n(2)});L.push({t:`출입처 장악도 40 또는 제자`,ok:bm>=40||!!S.protege});L.push({t:`신뢰 ${Math.round(S.trust)}/45`,ok:S.trust>=45});}
  if(r===3){L.push({t:`부서 성적 2위 이내 ${S.deptTop||0}/${n(3)}회`,ok:(S.deptTop||0)>=n(3)});L.push({t:'특종 이상 1건 또는 기자상',ok:(S.tokjong||0)>=1||(S.awards||0)>=1});L.push({t:`신뢰 ${Math.round(S.trust)}/50`,ok:S.trust>=50});}
  if(r===4){L.push({t:`1면 대결 ${S.fwWins||0}/${n(3)}승 또는 특종 ${S.tokjong||0}/2`,ok:(S.fwWins||0)>=n(3)||(S.tokjong||0)>=2});L.push({t:`신뢰 ${Math.round(S.trust)}/52`,ok:S.trust>=52});}

// ===== 기자들의 나이·연차·보직에 따른 행동 =====
// 주니어는 빨리 크지만 쉽게 흔들리고(이직·실수), 중견은 경쟁사가 노리는 전성기, 시니어는 덜 크고 덜 떠나며 후배를 가르친다. 60세면 정년.
function npcStage(m){const y=myrs(m);return y<5?'jr':y<13?'mid':y<22?'sr':'vet';}
const NPC_GROW={jr:.15,mid:.08,sr:.03,vet:-.03};
function npcLife(lines){const T=(S.team||[]);if(!T.length&&!(S.mates||[]).length)return;const mood=S.wMood??60;
  const all=T.concat((S.mates||[]).filter(m=>!T.includes(m)));
  all.forEach(m=>{const st=npcStage(m);m.skill=clamp(m.skill+NPC_GROW[st]*(m.r>=1&&st!=='vet'?1.2:1)*(mood>=70?1.2:mood<35?.6:1),15,92);});
  // 시니어가 있으면 주니어가 더 큰다 (사수-부사수)
  const sr=T.filter(m=>['sr','vet'].includes(npcStage(m))).length,jr=T.filter(m=>npcStage(m)==='jr');if(sr&&jr.length)jr.forEach(m=>m.skill+=.04*Math.min(3,sr));
  // 주니어 이탈: 처우·사기가 나쁠수록 (대기업 홍보실·로스쿨·공무원 등)
  if(S.rank>=2&&T.length>3){const j=T.filter(m=>npcStage(m)==='jr'&&m.rk==null&&!(m.own!=null&&S.turn-m.own<YW*3&&chance(.7)));const p=.012*j.length*(mood<40?2:mood>70?.5:1)*((S.payLv||1)<.95?1.5:1);if(chance(p)){const m=pick(j);S.team=S.team.filter(x=>x!==m);S.co.staff=Math.max(1,S.co.staff-1);const to=pick(['대기업 홍보실','로스쿨','공무원 시험','스타트업','다른 언론사']);log(`${m.name} 기자 퇴사 — ${to}`);lines.push({c:'r',t:`${m.name} 기자(${myrs(m)}년 차·${npcAge(m)}세)가 ${to}(으)로 떠났다`});}}}
// 정기 인사 때: 정년퇴직 · 명예퇴직 · 연차에 따른 자동 승진(내가 인사권자가 아니면)
function npcJinsa(){const out=[];const T=S.team||[];const hard=S.co&&S.co.cash<0;
  T.slice().forEach(m=>{const a=npcAge(m);if(a>=60||(a>=55&&hard&&chance(.25))){S.team=S.team.filter(x=>x!==m);const n=genMember(m.d,30,48);n.yrs=R(1,3);n.t0=S.turn;S.team.push(n);out.push(`${m.name} ${MR[m.r||0]}(${a}세) ${a>=60?'정년퇴직':'명예퇴직'} → 후임 ${n.name} 기자`);log(`${m.name} ${a>=60?'정년퇴직':'명예퇴직'}`);}});
  (S.mates||[]).slice().forEach(m=>{if(npcAge(m)>=60){S.mates=S.mates.filter(x=>x!==m);out.push(`${m.name} 선배 정년퇴직`);}});
  if(!S.founder&&S.rank>=2&&S.rank<=5&&typeof teamSize==='function'){let k=0;while(S.team.length<teamSize()&&k++<3){const n=genMember(S.dept,30,46);n.yrs=R(1,2);n.t0=S.turn;S.team.push(n);S.co.staff++;out.push(`신입 ${n.name} 기자 배치`);}}
  if(!(S.rank>=6||S.founder)){const L=(S.team||[]).concat(S.mates||[]);L.forEach(m=>{const r=m.r||0;const need=[10,15,20][r];if(r<3&&need&&myrs(m)>=need&&m.skill>=45&&chance(.35)){const taken=L.some(x=>x!==m&&x.d===m.d&&(x.r||0)===r+1);if(!taken||r===0){m.r=r+1;if(m.role&&MR.includes(m.role))m.role=MR[m.r];out.push(`${m.name} ${MR[r]} → ${MR[m.r]} (${myrs(m)}년 차)`);}}});}
  return out.length?`<p class="hint">우리 쪽 인사: ${out.slice(0,6).map(esc).join(' · ')}${out.length>6?` 외 ${out.length-6}건`:''}</p>`:'';}
// 경쟁사가 노리는 기자: 실력 좋은 5~12년 차
function poachPick(){const T=S.team||[];const w=T.map(m=>{const st=npcStage(m);return (st==='mid'?3:st==='jr'?1.2:st==='sr'?.8:.2)*(1+Math.max(0,m.skill-50)/25);});let t=w.reduce((a,b)=>a+b,0)*Math.random();for(let i=0;i<T.length;i++){t-=w[i];if(t<=0)return T[i];}return T[0];}

function jobDeal(f){const o=f.o,cur=OUT();const star=(S.fame>=40||(S.awards||0)>=1||(S.bigScoops||0)>=1);const dp=o.p-cur.p;
  const payK=+(1+(star?R(8,18):R(0,8))/100*(dp<=0?1:.6)).toFixed(2);const np=Math.round(payOf(o,f.rank)/(S.payK||1)*payK/5)*5,cp=payOf(cur);const dPay=Math.round((np/cp-1)*100);
  const bonus=star&&dp<=0&&chance(.6)?Math.round(cp*R(2,4)/10)*10:0;const pros=[],cons=[];
  (dPay>=3?pros:dPay<=-3?cons:pros).push(`월급 ${np.toLocaleString('ko-KR')}만 원 (${dPay>=0?'+':''}${dPay}%)`);
  if(f.adj>0)pros.push(`직급 ${rankName()} → ${rankName(f.rank)}`);if(f.adj<0)cons.push(`직급 ${rankName()} → ${rankName(f.rank)}`);
  if(bonus)pros.push(`이적 보너스 ${bonus.toLocaleString('ko-KR')}만 원`);
  if(dp>0)pros.push('더 큰 간판 — 평판이 잘 오르고 취재망이 두텁다');if(dp<0)cons.push('간판이 작다 — 평판이 덜 오른다');
  const ok=orgK(o),ok0=orgK(cur);if(ok.ten<ok0.ten-.05)pros.push('승진이 더 빠르다');else if(ok.ten>ok0.ten+.05||ok.pick<.85)cons.push('승진 경쟁이 세다');
  if(o.lean!==cur.lean)cons.push(`논조가 다르다 (${LEAN[o.lean]})`);
  if(S.eval>58)cons.push('사내 평가가 55부터 다시 시작');else if(S.eval<52)pros.push('사내 평가를 새로 쌓을 기회');
  cons.push('출입처 장악도·동료 관계가 처음부터');if(S.protege)cons.push('제자와 헤어진다');
  if(f.capped)cons.push('나이 때문에 직급 대우가 묶였다');
  const cond=['이직 뒤 1년은 다시 옮길 수 없다'];if(bonus)cond.push('2년 안에 나가면 보너스를 돌려준다');
  if(S.jobBind&&S.turn<S.jobBind.until)cons.push(`지금 회사 의무 근무 위반 — 보너스 ${S.jobBind.amt.toLocaleString('ko-KR')}만 원 반환`);
  const sum=[`월급 ${dPay>=0?'+':''}${dPay}%`,f.adj?`직급 ${f.adj>0?'▲':'▼'}`:'직급 그대로',bonus?`보너스 ${bonus.toLocaleString('ko-KR')}만`:'',pros.includes('승진이 더 빠르다')?'승진 빠름':cons.includes('승진 경쟁이 세다')?'승진 경쟁':''].filter(Boolean).join(' · ');
  return {payK,bonus,pros,cons,cond,sum};}

  L.sort((a,b)=>b[1]-a[1]);return {base,pay,list:L.slice(0,6),n:L.length};}

function rookieWeeks(o){o=o||OUT();return o.p>=5?24:o.p>=3?16:12;}
function rookieEv(o){o=o||OUT();return Math.round(({1:40,2:42,3:45,4:48,5:52}[o.p]||45)+(DF().need||0)/2);}
function rookieReqs(o){o=o||OUT();if(S.story)return [];const mo=rookieWeeks(o)/4;const L=[{t:`수습 평가 ${Math.round(S.eval)}/${rookieEv(o)}`,ok:S.eval>=rookieEv(o)}];
  const rep=Math.max(2,Math.round(mo*(o.p>=4?1.5:1.2)*(S.simple?.6:1)));L.push({t:`정보보고 ${S.rkRep||0}/${rep}회`,ok:(S.rkRep||0)>=rep});
  const T=o.type;
  if(['daily','econ','local','weekly'].includes(T)){const n=Math.max(2,Math.round(mo*1.5*(S.simple?.6:1)));L.push({t:`${cat1(S.dept)==='spo'?'구장 돌기':'사쓰마와리'} ${S.rkSasu||0}/${n}회`,ok:(S.rkSasu||0)>=n});}
  if(T==='wire')L.push({t:`속도 ${Math.round(S.st.spd)}/24 (통신사는 1보가 생명)`,ok:S.st.spd>=24});

  if(o.p>=4&&!S.simple){const cp=colBy('cap');L.push({t:`캡과의 관계 ${cp?Math.round(cp.rel):0}/30`,ok:!!cp&&cp.rel>=30});}
  if(o.p>=5&&!S.simple)L.push({t:`캡 미션 완수 ${S.rkMiss||0}/2달`,ok:(S.rkMiss||0)>=2});

// ===== 선택지 읽기 쉽게: 설명(sub)을 효과 칩으로 쪼갠다 =====
const BAD_RE=/↓|위험|벌점|들키|논란|소송|반발|사표|이탈|비용|손해|불이익|깎|감소|줄어|낮아|-\d|−|적발|징계|체불|무너|흔들|부담|압박|떨어/;
const GOOD_RE=/↑|\+\d|늘|성장|회복|오른|높아|좋아|추천|확보|얻|보너스|안전/;
function subChips(sub){if(!sub)return '';const t=String(sub);if(/[<>]/.test(t))return `<span class="cs">${t}</span>`;
  const parts=t.split(/\s+·\s+|,\s+/).map(x=>x.trim()).filter(Boolean);if(parts.length<=1&&t.length>34)return `<span class="cs">${t}</span>`;
  return `<span class="chips">${parts.map(x=>{const neg=/(위험|비용|부담|소모|피로|벌점|리스크|오보|인건비|손실|경계)[^·]*/;let bad=BAD_RE.test(x),good=GOOD_RE.test(x);if(neg.test(x)&&/↓/.test(x)){good=true;bad=false;}else if(neg.test(x)&&/↑/.test(x)){bad=true;good=false;}if(/(대응|방어|보호|정확)↑/.test(x)){good=true;bad=false;}const pc=/성공|가능성|확률|%/.test(x)&&!bad;return `<i class="cp ${bad&&!good?'bad':good&&!bad?'good':pc?'pct':bad&&good?'mix':''}">${x}</i>`;}).join('')}</span>`;}

      if(moved&&!S.founder&&S.rank>=2&&S.rank<=5&&m.d!==S.dept){S.team=S.team.filter(x=>x!==m);(S.alumni=S.alumni||[]).push({name:m.name,d:m.d,rel:10,t:S.turn});}

  if(T.mode==='hard'&&chance(.12)){lines.push({c:'r',t:`${T.name} 수습이 "도저히 못 하겠다"며 사표를 냈다`});apply({eval:-1});S.trainee=null;return;}
  if(T.mode!=='basic'&&chance(.08)){lines.push({c:'r',t:`${T.name} 수습이 확인 안 된 첩보를 그대로 보고했다. 캡에게 같이 깨졌다`});apply({eval:-.4});}
  if(age>=rookieWeeks()){S.trainee=null;const pf=clamp(.4+({teach:-.08,basic:0,hard:.1}[T.mode]||0)+(DF()===DIFF.hard?.05:DF()===DIFF.easy?-.05:0),.2,.6);if(chance(pf))Q.push(()=>traineeFail(T));else Q.push(()=>traineePlace(T));}}
// 수습 평가에서 떨어질 때: 사수라면 보증을 서 볼 수 있다
function traineeFail(T){openModal('수습 탈락 위기',`<p class="lede">${esc(T.name)} 수습이 최종 평가에서 기준에 못 미쳤다. 인사위원회가 탈락 쪽으로 기울고 있다.</p>`,[
   ...(T.mode==='teach'?[{label:'사수로서 보증을 선다',sub:'성공하면 정식 배치 · 실패하면 내 평가↓',fn:()=>{if(chance(.6+T.rel/250)){toast('보증이 받아들여졌다');traineePlace(T);return false;}toast(`보증에도 탈락했다 · ${apply({eval:-1})}`);log(`${T.name} 수습 탈락`);}}]:[]),
   {label:'한 달 더 기회를 달라고 한다',sub:'연장 · 다시 평가',fn:()=>{T.t=S.turn-rookieWeeks()+4;T.rel+=2;S.trainee=T;toast('수습이 한 달 연장됐다');}},
   {label:'결과를 받아들인다',sub:'수습이 떠난다',fn:()=>{log(`${T.name} 수습 탈락`);toast(`${T.name} 수습이 회사를 떠났다`);}}]);}
// 수습이 끝나면 배치: 회사 수요·본인 희망·사수와의 관계로 정해진다
function traineePlace(T){const o=OUT();const others=o.depts.filter(d=>d!==S.dept&&!isRegD(d));const want=pick(others.length?others:o.depts);
  const pStay=clamp(.25+T.rel/150+(S.rank>=3?.2:S.rank>=2?.1:0)+(T.mode==='teach'?.15:0),.1,.85);
  const mk=d=>{const m=genMember(d,T.mode==='hard'?30:26,T.mode==='teach'?44:38);m.yrs=1;m.t0=S.turn;m.own=S.turn;m.rel=T.rel;m.name=T.name;return m;};
  const stay=()=>{const m=mk(S.dept);if(S.rank>=2){S.team.push(m);S.co.staff++;}else{S.mates=S.mates||[];m.role='기자';S.mates.push(m);}if(T.mode==='teach'&&S.rank>=2&&!S.protege)S.protege=T.name;if(T.mode==='teach')apply({eval:1,cha:.5});log(`${T.name} 수습 → 우리 부서 배치`);};
  const away=(d,happy)=>{(S.alumni=S.alumni||[]).push({name:T.name,d,rel:T.rel+(happy?15:0),t:S.turn});if(T.mode==='teach')apply({cha:.5});log(`${T.name} 수습 → ${DEPTS[d].n} 배치`);};
  openModal('수습 배치',`<p class="lede">${esc(T.name)} 수습의 정식 배치가 다가왔다. 본인은 <b>${DEPTS[want].n}</b>를 희망한다.</p><p class="hint">수습은 끝나면 회사 사정과 본인 희망에 따라 여러 부서로 흩어진다. 다른 부서로 가도 가르친 후배는 그 부서 소식을 물어다 준다.</p>`,[
   {label:'우리 부서로 데려오고 싶다고 요청한다',sub:`받아들여질 가능성 ${pStay>=.6?'높음':pStay>=.35?'반반':'낮음'} · 실패하면 관계 조금↓`,fn:()=>{if(chance(pStay)){stay();toast(`${T.name}이(가) 우리 부서에 남게 됐다`);}else{T.rel-=8;away(want,false);toast(`인사팀이 ${DEPTS[want].n}로 보냈다`);}}},
   {label:'본인 희망대로 가라고 밀어준다',rec:true,sub:`${DEPTS[want].n} 배치 · 관계↑ · 그 부서 소식통이 생긴다`,fn:()=>{away(want,true);toast(`${T.name}, ${DEPTS[want].n}로 간다`);}},
   {label:'인사팀에 맡긴다',sub:'회사 수요대로',fn:()=>{const d=chance(.3)?S.dept:pick(others.length?others:o.depts);if(d===S.dept){stay();toast(`${T.name}이(가) 우리 부서로 왔다`);}else{away(d,false);toast(`${T.name}, ${DEPTS[d].n} 배치`);}}}]);}
// 다른 부서로 간 후배들: 가끔 그 부서 아이템이나 소식을 귀띔한다
function alumniMonth(lines){const A=S.alumni||[];if(!A.length)return;A.forEach(a=>{if(a.rel>=20&&chance(.05)&&S.items.length<6){const it=makeItem(a.d,{mult:.9});it.from=a.name;S.items.push(it);lines.push({c:'g',t:`${DEPTS[a.d]?DEPTS[a.d].n:'다른 부서'}로 간 후배 ${a.name}이(가) 「${it.title}」을 귀띔했다`});}});if(A.length>8)A.shift();}
// 1월·7월 공채 시즌에 '나올 수도' 있다 (확정 아님, 약 50%)
function traineeTick(Qx){if(S.founder||S.story||S.rank<1||S.rank>3||S.trainee||cat1(S.dept)!=='soc'||![1,7].includes(month())||(S.trT||-999)>=S.turn-YW/3)return;S.trT=S.turn;if(chance(.5))Qx.push(()=>traineeEvent());}
// ===== 인력 수급 균형: 수습이 늘면 그만큼 빠져나간다 =====
// 부서 정원보다 사람이 많으면 다른 부서 발령·이직·퇴사가 늘고, 경쟁사도 북적이는 곳을 노린다
function staffBalance(lines){if(S.founder||S.story)return;const T=S.team||[];
  if(S.rank>=2&&S.rank<=5&&T.length){const cap=teamSize()+2;const over=T.length-cap;if(over>0&&chance(clamp(.22*over,0,.8))){
    const L=T.filter(m=>m.rk==null&&m.name!==S.protege).sort((a,b)=>((a.rel??20)+(npcStage(a)==='vet'?30:0))-((b.rel??20)+(npcStage(b)==='vet'?30:0)));const m=L[0];if(m){S.team=S.team.filter(x=>x!==m);
      const r=Math.random();if(r<.55){const d=pick(OUT().depts.filter(x=>x!==S.dept&&!isRegD(x)))||S.dept;lines.push({c:'',t:`부서가 붐빈다. ${m.name} 기자(${myrs(m)}년 차)가 ${DEPTS[d].n}로 발령됐다`});}
      else if(r<.85){if(S.co)S.co.staff=Math.max(1,S.co.staff-1);const c=S.comp&&S.comp.length?pick(S.comp):null;lines.push({c:'r',t:`자리가 없다며 ${m.name} 기자가 ${c?cName(c):'다른 매체'}로 이직했다`});if(c)c.q+=.5;}
      else{if(S.co)S.co.staff=Math.max(1,S.co.staff-1);lines.push({c:'r',t:`${m.name} 기자가 ${pick(['기업 홍보실','로스쿨','공공기관','유튜브 채널'])}(으)로 진로를 바꿨다`});}}}}
  if(S.rank<=1&&(S.mates||[]).length>9){const m=S.mates.filter(x=>x.name!==S.name).sort((a,b)=>(a.rel??20)-(b.rel??20))[0];if(m){S.mates=S.mates.filter(x=>x!==m);lines.push({c:'',t:`${m.name} 선배가 다른 부서로 옮겼다`});}}
  // 회사 전체: 수습을 많이 뽑으면 그만큼 고참 이탈·명예퇴직이 늘어 인원이 한쪽으로 쏠리지 않는다
  if(S.co&&S.rank>=6){const o=OUT();const base=o.staff||S.co.staff;if(S.co.staff>base*1.25&&chance(.25)){const n=Math.max(1,Math.round((S.co.staff-base*1.25)*.1));S.co.staff-=n;lines.push({c:'',t:`인원이 불어나자 고참 ${n}명이 명예퇴직·이직으로 나갔다`});}}}
// ================= 로딩 화면 =================
const LD_STEPS=['윤전기 예열하는 중…','전국 언론사 명단 불러오는 중…','취재원 수첩 넘기는 중…','오늘 자 1면 짜는 중…','편집국 불 켜는 중…'];
const LD_TIPS=['핵심 사실은 두 출처로 확인해야 기사가 된다.','반론 없는 기사는 소송의 지름길이다.','취재원 관계는 한 번 깨지면 다시 쌓기 어렵다.','수습 때는 사쓰마와리로 경찰서를 돌며 정보를 모은다.','단독은 늦으면 물먹는다. 그렇다고 서두르면 오보가 난다.','데스크가 되면 남의 기사를 고치고 책임도 진다.','창간 모드에선 돈이 떨어지면 끝이다.','소리 설정은 위쪽 ♪ 버튼에서 바꿀 수 있다.'];
let LD={t0:performance.now(),iv:null,step:0};
function loaderRun(msg){const el=$('#loader');if(!el)return;LD.gen=(LD.gen||0)+1;const g=LD.gen;clearTimeout(LD.safe);LD.safe=setTimeout(()=>{if(LD.gen===g){clearInterval(LD.iv);el.classList.add('done');}},4000);el.classList.remove('done');const p=$('#ldp'),tx=$('#ldt'),tp=$('#ldtip');tp.textContent='팁: '+pick(LD_TIPS);LD.step=0;LD.t0=performance.now();p.style.width='8%';
  clearInterval(LD.iv);LD.iv=setInterval(()=>{LD.step++;const k=Math.min(LD.step,LD_STEPS.length-1);tx.textContent=msg&&LD.step<2?msg:LD_STEPS[k];p.style.width=Math.min(92,8+LD.step*18)+'%';if(LD.step===3)tp.textContent='팁: '+pick(LD_TIPS);},240);if(msg)tx.textContent=msg;}
function loaderDone(min){const el=$('#loader');if(!el)return;const g=LD.gen||0;const wait=Math.max(0,(min??1100)-(performance.now()-LD.t0));setTimeout(()=>{if((LD.gen||0)!==g)return;clearInterval(LD.iv);$('#ldp').style.width='100%';$('#ldt').textContent='준비 완료';setTimeout(()=>{if((LD.gen||0)===g)el.classList.add('done');},220);},wait);}
function flashLoad(msg,ms){loaderRun(msg);loaderDone(ms||750);}

// ================= 시작 =================
function migrate(s){if(!s)return s;try{(s.npcOut||[]).forEach(o=>{if(!OUTLETS.some(x=>x.id===o.id))OUTLETS.push(o);});(s.closedOut||[]).forEach(id=>{const o=OUTLETS.find(x=>x.id===id);if(o)o.closed=1;});}catch(e){}if((s.ver4||0)<2){s.mates=null;s.ros=null;s.corr=null;s.ver4=2;}if(s.custom){const i=OUTLETS.findIndex(x=>x.id==='mine');if(i>=0)OUTLETS.splice(i,1);OUTLETS.push(s.custom);}if(s.phase==='game'&&!s.cols){const k=S;S=s;initColleagues(true);S=k;}if(s.phase==='game'&&!s.portal){const k=S;S=s;initPortal(OUT());initComp();S=k;}if(s.phase==='game'&&(!s.net||!s.ents)){const k=S;S=s;initNet(s.net||null);S=k;}if(s.ents){const bw={};[...Object.values(ENT_BASE).flat(),...Object.values(TYPE_ENT).flat(),...Object.values(ID_ENT).flat()].forEach(e=>{if(e[3]>0&&!(e[0] in bw))bw[e[0]]=e[3];});s.ents.forEach(e=>{if(!e[4]&&bw[e[0]])e[4]=bw[e[0]];});normEnts(s.ents,OUTLETS.find(x=>x.id===s.outlet));setEnts(s.ents);}for(const k in ST0)if(s.st&&s.st[k]==null)s.st[k]=ST0[k];(s.items||[]).forEach(i=>{if(!i.ent)i.ent=findEnt(i.title,i.subj||'',i.d);});s.cd=s.cd||{};s.ach=s.ach||{};s.ticker=s.ticker||[];s.flags=s.flags||{};s.items=(s.items||[]).filter(i=>i.facts&&i.facts[0]&&'conf' in i.facts[0]);return s;}
function start(data){
  let dev=false;try{dev=localStorage.getItem('byline-dev')==='1';}catch(e){}
  S=(data&&data.S)?migrate(data.S):newState();S.dev=devOK()&&(S.dev||dev);
  if(S.phase!=='game'&&S.phase!=='end'){S.phase='title';}
  S.scene=baseScene();render();presenceStart();loaderDone(1300);
}
try{window.claude?.hot?.snapshot?.(()=>({S}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
